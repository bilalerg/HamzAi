<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profaix — Sorgu Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');

  :root {
    --bg: #f7f3ee;
    --surface: #fffefb;
    --surface2: #f2ede6;
    --border: #e8e0d5;
    --border2: #d8cfc3;
    --accent: #bf5b2a;
    --accent2: #e8895a;
    --accent-lt: #fdf0e8;
    --accent-dim: rgba(191,91,42,0.12);
    --text: #1e1410;
    --text2: #5a4a3e;
    --muted: #998880;
    --muted2: #c8bdb5;
    --user-bg: #bf5b2a;
    --alacak: #a8430e;
    --s1: 0 1px 3px rgba(80,40,15,0.08);
    --s2: 0 4px 16px rgba(80,40,15,0.1), 0 1px 4px rgba(80,40,15,0.06);
    --s3: 0 8px 32px rgba(80,40,15,0.12), 0 2px 8px rgba(80,40,15,0.07);
    --r: 12px;
    --r2: 18px;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    padding: 0 32px;
    height: 64px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    box-shadow: var(--s1);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }
  .logo-img { display:flex; align-items:center; }
  .logo-text {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .logo-text em { font-style: italic; color: var(--accent); }
  .sep { width: 1px; height: 20px; background: var(--border2); }
  .header-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--accent-lt);
    border: 1px solid rgba(191,91,42,0.2);
    padding: 5px 13px;
    border-radius: 100px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(0.85); }
  }
  .status-label { font-size: 11px; font-weight: 500; color: var(--accent); letter-spacing: 0.2px; }

  /* ── MESSAGES ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* ── WELCOME ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 52px 24px 36px;
    gap: 16px;
  }
  .welcome-icon {
    width: 64px; height: 64px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--s2);
    margin-bottom: 6px;
    position: relative;
    overflow: hidden;
  }
  .welcome-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(191,91,42,0.1), transparent 70%);
  }
  .welcome-icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }
  .welcome h2 {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .welcome h2 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .welcome p { font-size: 13.5px; color: var(--muted); line-height: 1.75; max-width: 300px; font-weight: 300; }
  .quick-section { width: 100%; max-width: 540px; }
  .quick-label {
    font-size: 10px;
    color: var(--muted2);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: left;
    font-weight: 500;
  }
  .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .quick-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--s1);
  }
  .quick-btn:hover {
    background: var(--accent-lt);
    border-color: rgba(191,91,42,0.3);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--s2);
  }
  .quick-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .quick-btn.primary:hover { background: #a84b22; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(191,91,42,0.35); }

  /* ── MESSAGES ── */
  .message {
    display: flex;
    flex-direction: column;
    max-width: 74%;
    animation: msgIn 0.3s cubic-bezier(0.34,1.4,0.64,1);
  }
  @keyframes msgIn {
    from { opacity:0; transform: translateY(10px) scale(0.96); }
    to   { opacity:1; transform: none; }
  }
  .message.user { align-self: flex-end; }
  .message.bot  { align-self: flex-start; }
  .msg-meta { font-size: 10px; color: var(--muted2); margin-bottom: 5px; letter-spacing: 0.2px; }
  .message.user .msg-meta { text-align: right; }
  .bubble {
    padding: 13px 17px;
    font-size: 13.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
    font-weight: 400;
  }
  .message.user .bubble {
    background: var(--user-bg);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 3px 14px rgba(191,91,42,0.28);
  }
  .message.bot .bubble {
    background: var(--surface);
    color: var(--text);
    border-radius: 4px 18px 18px 18px;
    border: 1px solid var(--border);
    box-shadow: var(--s2);
  }

  /* ── BUTONLAR ── */
  .firma-btn {
    margin-top: 7px;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--accent);
    border: 1.5px solid rgba(191,91,42,0.25);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    transition: all 0.18s;
    text-align: left;
  }
  .firma-btn:hover { background: var(--accent-lt); border-color: var(--accent); transform: translateX(2px); }
  .irsaliye-btn {
    margin-top: 7px;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    width: 100%;
    transition: all 0.18s;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .irsaliye-btn:hover { background: var(--accent-lt); border-color: rgba(191,91,42,0.3); color: var(--accent); transform: translateX(2px); }
  .irsaliye-btn .kg { font-size: 11px; color: var(--muted); font-weight: 400; }
  .cari-btn {
    margin-top: 7px;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    width: 100%;
    transition: all 0.18s;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cari-btn:hover { background: var(--accent-lt); border-color: rgba(191,91,42,0.3); color: var(--accent); }
  .cari-btn .bakiye { font-size: 12px; font-weight: 600; }
  .cari-btn .bakiye.alacak { color: var(--alacak); }
  .cari-btn .bakiye.sifir { color: var(--muted2); }
  .cari-row {
    margin-top: 7px;
    padding: 11px 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    transition: all 0.15s;
  }
  .cari-row:hover { border-color: rgba(191,91,42,0.25); box-shadow: var(--s1); }
  .cari-row .cari-ad { font-weight: 500; color: var(--text); }
  .cari-row .cari-bakiye { font-weight: 600; font-size: 13px; }
  .cari-row .cari-bakiye.alacak { color: var(--alacak); }
  .cari-row .cari-bakiye.sifir { color: var(--muted2); }
  .form-wrap { margin-top: 10px; display: flex; flex-direction: column; gap: 9px; }
  .form-row { display: flex; gap: 9px; align-items: center; }
  .form-label { font-size: 11px; color: var(--muted); min-width: 80px; text-align: right; }
  .form-input {
    flex: 1;
    padding: 9px 13px;
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    background: var(--bg);
    transition: border-color 0.18s, box-shadow 0.18s;
    color: var(--text);
  }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .form-input.required { border-color: rgba(191,91,42,0.35); }
  .fiyat-input-wrap { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fiyat-input {
    flex: 1;
    min-width: 100px;
    padding: 10px 13px;
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    background: var(--bg);
    transition: border-color 0.18s, box-shadow 0.18s;
    color: var(--text);
  }
  .fiyat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .btn-primary {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-primary:hover { background: #a84b22; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(191,91,42,0.32); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary {
    padding: 10px 20px;
    background: var(--surface2);
    color: var(--text2);
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-secondary:hover { background: var(--border); color: var(--text); }
  .btn-cancel {
    padding: 10px 15px;
    background: transparent;
    color: #c0392b;
    border: 1.5px solid rgba(192,57,43,0.25);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-cancel:hover { background: #fff5f5; border-color: #c0392b; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .img-bubble {
    background: var(--user-bg);
    padding: 6px;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 3px 14px rgba(191,91,42,0.28);
    display: inline-block;
  }
  .img-bubble img { max-width: 220px; max-height: 180px; border-radius: 10px; display: block; }

  /* ── TYPING ── */
  .typing-wrap {
    display: flex;
    flex-direction: column;
    max-width: 74%;
    align-self: flex-start;
    animation: msgIn 0.3s cubic-bezier(0.34,1.4,0.64,1);
  }
  .typing-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 18px 18px 18px;
    padding: 15px 20px;
    display: flex;
    gap: 6px;
    align-items: center;
    box-shadow: var(--s2);
    width: fit-content;
  }
  .typing-bubble span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted2);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.16s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity:0.4; }
    30% { transform: translateY(-6px); opacity:1; }
  }

  /* ── INPUT AREA ── */
  .input-area {
    padding: 14px 40px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg);
    border: 1.5px solid var(--border2);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 24px;
    line-height: 1.6;
    padding: 3px 0;
  }
  textarea::placeholder { color: var(--muted2); }
  .upload-btn {
    width: 38px; height: 38px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .upload-btn:hover { background: var(--accent-lt); border-color: rgba(191,91,42,0.3); }
  .upload-btn svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .upload-btn:hover svg { stroke: var(--accent); }
  .send-btn {
    width: 38px; height: 38px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .send-btn:hover { background: #a84b22; transform: scale(1.08); box-shadow: 0 4px 14px rgba(191,91,42,0.4); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .input-hint { font-size: 10.5px; color: var(--muted2); margin-top: 8px; padding-left: 4px; }

  /* ── CARİ DROPDOWN ── */
  .cari-search-wrap { position: relative; margin-bottom: 10px; }
  .cari-search-input {
    width: 100%;
    padding: 10px 13px;
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .cari-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .cari-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    box-shadow: var(--s3);
    z-index: 100;
    max-height: 220px;
    overflow-y: auto;
    animation: dropIn 0.15s ease;
  }
  @keyframes dropIn {
    from { opacity:0; transform: translateY(-6px); }
    to   { opacity:1; transform: none; }
  }
  .cari-dropdown-item {
    padding: 10px 15px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.12s;
  }
  .cari-dropdown-item:hover, .cari-dropdown-item.active { background: var(--accent-lt); }
  .cari-dropdown-item .dd-bakiye { font-size: 12px; font-weight: 600; color: var(--alacak); }
  .cari-dropdown-empty { padding: 10px 15px; font-size: 12px; color: var(--muted); }

  /* ── QUICK PANEL ── */
  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(30,20,16,0.35);
    backdrop-filter: blur(2px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .panel-overlay.open { opacity: 1; pointer-events: all; }
  .quick-panel {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 272px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    box-shadow: var(--s3);
    z-index: 201;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .quick-panel.open { transform: translateX(0); }
  .panel-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .panel-header-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 400; color: var(--text); letter-spacing: -0.2px; }
  .panel-header-title em { font-style: italic; color: var(--accent); }
  .panel-close {
    width: 32px; height: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 15px;
    transition: all 0.15s;
  }
  .panel-close:hover { background: var(--accent-lt); color: var(--accent); }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px 14px; }
  .panel-section-label {
    font-size: 9.5px;
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
    margin-top: 16px;
    padding-left: 4px;
    font-weight: 500;
  }
  .panel-section-label:first-child { margin-top: 0; }
  .panel-btn {
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--text2);
    cursor: pointer;
    text-align: left;
    margin-bottom: 2px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-btn:hover {
    background: var(--accent-lt);
    border-color: rgba(191,91,42,0.18);
    color: var(--accent);
    transform: translateX(3px);
  }
  .panel-btn .btn-icon { font-size: 15px; flex-shrink: 0; }

  .panel-toggle {
    position: fixed;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 56px;
    background: var(--accent);
    border-radius: 0 12px 12px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 199;
    box-shadow: 3px 0 12px rgba(191,91,42,0.28);
    transition: all 0.2s;
  }
  .panel-toggle:hover { width: 32px; background: #a84b22; }
  .panel-toggle svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

  @media(max-width:600px) {
    .quick-panel { width: 84vw; }
    .header, .messages, .input-area { padding-left: 16px; padding-right: 16px; }
    .message, .typing-wrap { max-width: 92%; }
    .sep, .header-label { display: none; }
  }
</style>
</head>
<body>

<div class="panel-overlay" id="panelOverlay" onclick="panelKapat()"></div>

<div class="quick-panel" id="quickPanel">
  <div class="panel-header">
    <div class="panel-header-title">Pro<em>faix</em></div>
    <button class="panel-close" onclick="panelKapat()">✕</button>
  </div>
  <div class="panel-body">
    <div class="panel-section-label">İşlemler</div>
    <button class="panel-btn" onclick="panelKapat();bekleyenIrsaliyeleriGoster()"><span class="btn-icon">📋</span> Bekleyen irsaliyeler</button>
    <button class="panel-btn" onclick="panelKapat();topluFaturaGoster()"><span class="btn-icon">🧾</span> Toplu fatura</button>
    <button class="panel-btn" onclick="panelKapat();faturaListesiGoster()"><span class="btn-icon">🔍</span> Fatura sorgula</button>
    <button class="panel-btn" onclick="panelKapat();tahsilatFormGoster()"><span class="btn-icon">💵</span> Tahsilat ekle</button>
    <button class="panel-btn" onclick="panelKapat();cariFormGoster()"><span class="btn-icon">➕</span> Yeni cari</button>
    <div class="panel-section-label">Raporlar</div>
    <button class="panel-btn" onclick="panelKapat();bakiyeleriGoster()"><span class="btn-icon">💰</span> Müşteri bakiyeleri</button>
    <button class="panel-btn" onclick="panelKapat();hesapOzetiGoster()"><span class="btn-icon">📊</span> Hesap özeti</button>
    <button class="panel-btn" onclick="panelKapat();gunlukOzetGoster()"><span class="btn-icon">📈</span> Günlük özet</button>
    <button class="panel-btn" onclick="panelKapat();sonFisleriGoster()"><span class="btn-icon">🗂️</span> Son yüklenen fişler</button>
    <div class="panel-section-label">Sistem</div>
    <button class="panel-btn" onclick="cacheYenile(this)"><span class="btn-icon">🔄</span> Bakiyeleri yenile</button>
  </div>
</div>

<div class="panel-toggle" id="panelToggle" onclick="panelAc()" title="Menü">
  <svg viewBox="0 0 14 14"><line x1="2" y1="4" x2="12" y2="4"/><line x1="2" y1="7" x2="12" y2="7"/><line x1="2" y1="10" x2="12" y2="10"/></svg>

  </div>
  <div class="sep"></div>
  <div class="header-label">Sorgu Paneli</div>
  <div class="status-pill">
    <div class="status-dot"></div>
    <div class="status-label">Çevrimiçi</div>
  </div>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <h2>Merhaba,<br><em>Profaix</em>'e hoş geldiniz.</h2>
    <p>Hurda takip ve muhasebe işlemleriniz için buradayım. Ne yapalım bugün?</p>
  </div>
</div>

<div class="input-area">
  <div class="input-box">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Fiş fotoğrafı yükle">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadFis(this)">
    <textarea id="chatInput" placeholder="Mesajınızı yazın veya fiş fotoğrafı yükleyin…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()" id="sendBtn" title="Gönder">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="input-hint">📎 Fiş yükle &nbsp;·&nbsp; Enter → gönder &nbsp;·&nbsp; Shift+Enter → yeni satır</div>
</div>

<script>
  const SESSION_ID = 'web_' + Math.random().toString(36).substr(2, 9);
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('chatInput');
  const sendBtn    = document.getElementById('sendBtn');
  let faturaAkisi  = null;
  let _aktifPanel  = null; // Aktif panel elementi

  function _panelKapat() {
    if (_aktifPanel) {
      // Tüm buton ve inputları devre dışı bırak
      _aktifPanel.querySelectorAll('button, input, select').forEach(function(el) {
        el.disabled = true;
        el.style.opacity = '0.4';
        el.style.cursor = 'not-allowed';
      });
      _aktifPanel.style.opacity = '0.5';
      _aktifPanel = null;
    }
  }

  // ── GÜNLÜK ÖZET ──────────────────────────────────────────────────

  async function gunlukOzetGoster() {
    showTyping();
    try {
      const res = await fetch('/api/gunluk-ozet');
      const d = await res.json();
      removeTyping();
      const durum = d.bekleyen > 0
        ? `⚠️ ${d.bekleyen} fiş bekliyor`
        : '✅ Tüm fişler tamamlandı';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'font-size:13px;line-height:2;';
      wrap.innerHTML =
        `<b>📈 ${d.tarih} Günlük Özet</b><br>` +
        `📋 Yüklenen fiş: <b>${d.fis_sayisi}</b><br>` +
        `⚖️ Toplam ağırlık: <b>${(d.toplam_kg||0).toLocaleString('tr-TR')} kg (${d.toplam_ton} ton)</b><br>` +
        `✅ Tamamlanan: <b>${d.tamamlanan}</b><br>` +
        `🕐 Bekleyen: <b>${d.bekleyen}</b><br>` +
        `${durum}`;
      addMessage('', 'bot', wrap);
    } catch {
      removeTyping();
      addMessage('❌ Günlük özet yüklenemedi.', 'bot');
    }
  }

  // ── SON FİŞLER ───────────────────────────────────────────────────

  async function sonFisleriGoster() {
    showTyping();
    try {
      const res = await fetch('/api/son-fisler');
      const d = await res.json();
      removeTyping();
      if (!d.fisler || d.fisler.length === 0) {
        addMessage('📂 Henüz fiş yüklenmemiş.', 'bot');
        return;
      }
      const wrap = document.createElement('div');
      const baslik = document.createElement('div');
      baslik.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
      baslik.textContent = 'Son ' + d.fisler.length + ' yüklenen fiş:';
      wrap.appendChild(baslik);
      d.fisler.forEach(function(f) {
        const row = document.createElement('div');
        row.style.cssText = 'padding:8px 12px;background:var(--bg);border-radius:9px;margin-bottom:5px;font-size:12px;';
        const statusEmoji = f.status === 'TAMAMLANDI' ? '✅' : f.status === 'HATA' ? '❌' : '🕐';
        row.innerHTML =
          `<div style="display:flex;justify-content:space-between;margin-bottom:2px;">` +
          `<b style="font-size:13px;">${f.plaka}</b>` +
          `<span style="color:var(--muted)">${f.created_at}</span></div>` +
          `<div style="color:var(--muted)">${f.firma} · ${(f.agirlik_kg||0).toLocaleString('tr-TR')} kg · ${statusEmoji}</div>`;
        wrap.appendChild(row);
      });
      addMessage('🗂️ Son yüklenen fişler:', 'bot', wrap);
    } catch {
      removeTyping();
      addMessage('❌ Fişler yüklenemedi.', 'bot');
    }
  }

  // ── CACHE YENİLE ─────────────────────────────────────────────────

  async function cacheYenile(btn) {
    const orijinal = btn.innerHTML;
    btn.innerHTML = '<span class="btn-icon">⏳</span> Yenileniyor…';
    btn.disabled = true;
    try {
      await fetch('/api/cariler?refresh=1');
      btn.innerHTML = '<span class="btn-icon">✅</span> Yenilendi!';
      setTimeout(function() {
        btn.innerHTML = orijinal;
        btn.disabled = false;
      }, 2000);
      panelKapat();
      addMessage('✅ Bakiyeler yenilendi.', 'bot');
    } catch {
      btn.innerHTML = orijinal;
      btn.disabled = false;
      addMessage('❌ Yenileme başarısız.', 'bot');
    }
  }

  // ── PANEL ────────────────────────────────────────────────────────
  function panelAc() {
    document.getElementById('quickPanel').classList.add('open');
    document.getElementById('panelOverlay').classList.add('open');
    document.getElementById('panelToggle').style.display = 'none';
  }
  function panelKapat() {
    document.getElementById('quickPanel').classList.remove('open');
    document.getElementById('panelOverlay').classList.remove('open');
    document.getElementById('panelToggle').style.display = 'flex';
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') panelKapat();
  });

  function formatTarih(tarih) {
    // "2026-03-27" → "27.03.2026"
    if (!tarih || tarih === '-') return tarih;
    const m = tarih.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[3] + '.' + m[2] + '.' + m[1];
    return tarih;
  }
  // ── FAZLA TAHSİLAT ONAY DIALOGU ─────────────────────────────────
  function tahsilatOnayDialogu(guncelBakiye, girilenTutar, cariAdi, onayCallback) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'background:#fffbeb;border:1.5px solid #f59e0b;border-radius:11px;padding:14px 16px;';

    const baslik = document.createElement('div');
    baslik.style.cssText = 'font-size:13px;font-weight:600;color:#92400e;margin-bottom:8px;';
    baslik.textContent = '⚠️ Fazla Tutar Uyarısı';
    wrap.appendChild(baslik);

    const bilgi = document.createElement('div');
    bilgi.style.cssText = 'font-size:12px;color:#78350f;line-height:1.8;margin-bottom:12px;';
    bilgi.innerHTML =
      '🏢 <b>' + cariAdi + '</b><br>' +
      '📊 Güncel bakiye: <b>' + guncelBakiye.toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL</b><br>' +
      '💰 Girilen tutar: <b>' + girilenTutar.toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL</b><br>' +
      '⚡ Fark: <b>' + (girilenTutar - guncelBakiye).toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL fazla</b><br><br>' +
      'Bu cari eksiye düşecek. Yine de devam etmek istiyor musunuz?';
    wrap.appendChild(bilgi);

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:8px;';

    const onayBtn = document.createElement('button');
    onayBtn.className = 'btn-primary';
    onayBtn.style.background = '#b45309';
    onayBtn.textContent = '✅ Evet, devam et';
    onayBtn.onclick = function() {
      onayBtn.disabled = true;
      iptalOnayBtn.disabled = true;
      onayCallback();
    };

    const iptalOnayBtn = document.createElement('button');
    iptalOnayBtn.className = 'btn-cancel';
    iptalOnayBtn.textContent = '✕ İptal';
    iptalOnayBtn.onclick = function() {
      onayBtn.disabled = true;
      iptalOnayBtn.disabled = true;
      addMessage('❌ Tahsilat iptal edildi.', 'bot');
    };

    btnRow.appendChild(onayBtn);
    btnRow.appendChild(iptalOnayBtn);
    wrap.appendChild(btnRow);

    addMessage('', 'bot', wrap);
  }

  function plakacikar(aciklama) {
    if (!aciklama) return null;
    const m = aciklama.match(/\b(\d{2}[A-Z]{1,3}\d{2,4})\b/i);
    return m ? m[1].toUpperCase() : null;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function removeWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function now() {
    return new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, type, extraEl) {
    removeWelcome();
    // Önceki aktif paneli kapat
    if (extraEl && type === 'bot') {
      _panelKapat();
    }
    const wrap = document.createElement('div');
    wrap.className = 'message ' + type;
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = (type === 'user' ? 'Siz' : 'Profaix') + ' · ' + now();
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (text) bubble.textContent = text;
    if (extraEl) {
      bubble.appendChild(extraEl);
      if (type === 'bot') _aktifPanel = bubble;
    }
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    requestAnimationFrame(function() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
    return bubble;
  }

  function addImageMessage(src) {
    removeWelcome();
    const wrap = document.createElement('div');
    wrap.className = 'message user';
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.style.textAlign = 'right';
    meta.textContent = 'Siz · ' + now();
    const imgWrap = document.createElement('div');
    imgWrap.className = 'img-bubble';
    const img = document.createElement('img');
    img.src = src;
    img.style.cursor = 'pointer';
    img.onclick = () => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999;cursor:pointer;';
      const bigImg = document.createElement('img');
      bigImg.src = src;
      bigImg.style.cssText = 'max-width:90%;max-height:90%;border-radius:12px;';
      overlay.appendChild(bigImg);
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    };
    imgWrap.appendChild(img);
    wrap.appendChild(meta);
    wrap.appendChild(imgWrap);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    removeWelcome();
    // Mevcut typing varsa önce kaldır — duplicate olmasın
    removeTyping();
    const wrap = document.createElement('div');
    wrap.className = 'typing-wrap';
    wrap.id = 'typing';
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = 'Profaix yazıyor…';
    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    // requestAnimationFrame: DOM render tamamlandıktan sonra scroll yap
    requestAnimationFrame(function() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function fiyatGoster(fiyat) {
    // Fiyatı tam olarak göster — gereksiz sıfırları kırp ama değeri kesme
    // 14.4458 → "14,4458" | 14 → "14" | 14.5 → "14,5"
    if (fiyat === null || fiyat === undefined) return '';
    // Maksimum 4 ondalık hane, sondaki sıfırları kaldır
    let str = fiyat.toFixed(4).replace('.', ',').replace(/,?0+$/, '');
    // Binlik ayraç ekle (tam kısım için)
    let parcalar = str.split(',');
    parcalar[0] = parcalar[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return parcalar.join(',');
  }

  function parseFiyat(metin) {
    // KURAL: Nokta = binlik ayraç (yoksay), Virgül = ondalık ayraç
    // Sadece rakam, nokta ve virgül kabul et — harf içeriyorsa geçersiz
    metin = metin.trim()
      .replace(/tl/gi, '').replace(/lira/gi, '').replace('₺', '').trim();
    // Rakam, nokta ve virgül dışında karakter varsa geçersiz
    if (/[^0-9.,]/.test(metin)) return null;
    // Önce noktaları kaldır (binlik ayraç), sonra virgülü noktaya çevir (ondalık)
    metin = metin.replace(/\./g, '').replace(',', '.');
    const f = parseFloat(metin);
    return (f > 0) ? f : null;
  }

  // Fonksiyonlar params'ı alır, formu önceden doldurur — kullanıcı tekrar seçmez

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    // 1. Önce frontend keyword eşleştirmesi — hızlı, API isteği yok
    const eslesen = mesajYonlendir(text);
    if (eslesen) {
      addMessage(text, 'user');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      await eslesen.fn();
      return;
    }

    // 2. Keyword eşleşmedi → Haiku'ya intent sorusu
    addMessage(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mesaj: text, session_id: SESSION_ID })
      });
      const data = await res.json();
      removeTyping();

      const intent = data.intent || 'none';
      const mesaj  = data.cevap  || '';
      const params = data.params || {};

      if (intent !== 'none' && INTENT_MAP[intent]) {
        // Haiku bir intent tespit etti → önce mesajı göster, sonra akışı tetikle
        if (mesaj) addMessage(mesaj, 'bot');
        await INTENT_MAP[intent](params);
      } else {
        // intent = "none" → sadece mesajı göster
        addMessage(mesaj, 'bot');
      }

    } catch {
      removeTyping();
      addMessage('❌ Bağlantı hatası, lütfen tekrar deneyin.', 'bot');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function quickSend(text) {
    inputEl.value = text;
    sendMessage();
  }

  async function uploadFis(input) {

    reader.onload = (e) => addImageMessage(e.target.result);
    reader.readAsDataURL(file);
    sendBtn.disabled = true;
    showTyping();
    const formData = new FormData();
    formData.append('file', file);
    formData.append('session_id', SESSION_ID);
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      const data = await res.json();
      removeTyping();
      if (data.bekliyor === 'firma_sec') {
        const wrap = document.createElement('div');
        (data.firma_listesi || []).forEach(function(firma) {

          btn.textContent = '🏭 ' + firma;
          btn.onclick = function() { firmaSecildi(data.ticket_id, firma, data.malzemeler, wrap); };

      }

      removeTyping();
      addMessage('❌ Yükleme hatası, tekrar deneyin.', 'bot');

      input.value = '';

        ad.className = 'cari-ad';

        } else if (bakiye < 0) {
          bak.className = 'cari-bakiye';
          bak.style.color = '#2563eb';
          bak.textContent = Math.abs(bakiye).toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' TL 🔵';

        row.appendChild(bak);
        wrap.appendChild(row);

    inp.placeholder = 'Örn: 100000';

    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = 'Kaydet';

    // ── İPTAL BUTONU ──
    const iptalBtn = document.createElement('button');
    iptalBtn.className = 'btn-cancel';
    iptalBtn.textContent = '✕ İptal';
    iptalBtn.onclick = function() {

      btn.disabled = true;
      iptalBtn.disabled = true;
      addMessage('❌ Tahsilat iptal edildi.', 'bot');
    };

    const tahsilatGonder = async function(onaylandi) {
      const tutar = parseFiyat(inp.value);
      if (!tutar || tutar <= 0) {
        inp.style.borderColor = '#e53e3e';
        inp.placeholder = 'Geçersiz! Örn: 4.566 veya 4566,50';
        return;
      }
      inp.style.borderColor = '';
      btn.disabled = true;
      iptalBtn.disabled = true;
      btn.textContent = 'Kaydediliyor…';
      try {
        const res = await fetch('/api/tahsilat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cari_adi: cariAdi,
            tutar: tutar,
            tarih: tarihInp.value.trim() || '',
            onaylandi: onaylandi || false
          })
        });
        const data = await res.json();

        // Backend fazla tutar uyarisi dondu
        if (!data.basarili && data.fazla_tutar) {
          btn.disabled = false;
          btn.textContent = 'Kaydet';
          tahsilatOnayDialogu(
            data.guncel_bakiye,
            data.girilen_tutar,
            cariAdi,
            function() { tahsilatGonder(true); }
          );
          return;
        }

        addMessage(cariAdi + ' — ' + tutar.toLocaleString('tr-TR') + ' TL tahsilat', 'user');
        addMessage(data.cevap, 'bot');
      } catch {
        btn.disabled = false;
        btn.textContent = 'Kaydet';
        addMessage('❌ Tahsilat eklenemedi, tekrar deneyin.', 'bot');
      }
    };
    const gonder = function() { tahsilatGonder(false); };

    btn.onclick = gonder;
    inp.onkeydown = function(e) { if (e.key === 'Enter') gonder(); };

    row.appendChild(inp);
    row.appendChild(tarihInp);
    row.appendChild(btn);
    row.appendChild(iptalBtn);
    tutarWrap.appendChild(row);

    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:10.5px;color:var(--muted2);margin-top:5px;';
    hint.textContent = 'Tarih seçilmezse bugün kullanılır.';
    tutarWrap.appendChild(hint);

    wrapParent.appendChild(tutarWrap);
    setTimeout(function() { inp.focus(); }, 100);
  }

        inp.value = new Date().toISOString().split('T')[0];
      }
      inputs[alan.key] = inp;
      row.appendChild(label);
      row.appendChild(inp);
      formWrap.appendChild(row);
    });
    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    const kaydetBtn = document.createElement('button');
    kaydetBtn.className = 'btn-primary';
    kaydetBtn.textContent = 'Tahsilatı Kaydet';

      const cariAdi = inputs.cari_adi.value.trim();
      const tutar = parseFiyat(inputs.tutar.value || '');
      if (!cariAdi || !tutar || tutar <= 0) { addMessage('❌ Cari adı ve geçerli tutar giriniz.', 'bot'); return; }
      kaydetBtn.disabled = true;
      kaydetBtn.textContent = 'Kaydediliyor…';
      addMessage(cariAdi + ' — ' + tutar.toLocaleString('tr-TR') + ' TL tahsilat', 'user');
      try {
        const res = await fetch('/api/tahsilat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cari_adi: cariAdi, tutar: tutar, tarih: inputs.tarih.value.trim() })
        });
        const data = await res.json();
        addMessage(data.cevap, 'bot');
      } catch {
        addMessage('❌ Tahsilat eklenemedi, tekrar deneyin.', 'bot');
      }
    };
    const iptalBtn2 = document.createElement('button');
    iptalBtn2.className = 'btn-cancel';
    iptalBtn2.textContent = '✕ İptal';
    iptalBtn2.onclick = function() { addMessage('❌ Tahsilat iptal edildi.', 'bot'); };
    btnRow.appendChild(kaydetBtn);
    btnRow.appendChild(iptalBtn2);
    formWrap.appendChild(btnRow);
    wrap.appendChild(formWrap);
  }

  // ── CARİ SEÇİM DROPDOWN ──────────────────────────────────────────

  function cariSecimDropdown(cariler, onSec, placeholder) {
    placeholder = placeholder || 'Cari adı yazın...';
    const wrap = document.createElement('div');
    wrap.className = 'cari-search-wrap';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'cari-search-input';
    inp.placeholder = placeholder;
    inp.autocomplete = 'off';

    const dropdown = document.createElement('div');
    dropdown.className = 'cari-dropdown';
    dropdown.style.display = 'none';

    function renderDropdown(filtre) {
      dropdown.innerHTML = '';
      if (!filtre || filtre.length === 0) {
        dropdown.style.display = 'none';
        return;
      }
      const liste = cariler.filter(function(c) {
        return c.ad.toLowerCase().includes(filtre.toLowerCase());
      });
      if (liste.length === 0) {
        const bos = document.createElement('div');
        bos.className = 'cari-dropdown-empty';
        bos.textContent = 'Cari bulunamadı';
        dropdown.appendChild(bos);
      } else {
        liste.forEach(function(c) {
          const item = document.createElement('div');
          item.className = 'cari-dropdown-item';
          const ad = document.createElement('span');
          ad.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
          ad.textContent = c.ad;
          item.appendChild(ad);
          const bakiye = c.bakiye || 0;
          if (bakiye !== 0) {
            const bak = document.createElement('span');
            bak.className = 'dd-bakiye';
            bak.style.cssText = 'flex-shrink:0;margin-left:8px;white-space:nowrap;';
            if (bakiye > 0) {
              bak.textContent = bakiye.toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL ⚠️';
            } else {
              bak.style.color = '#2563eb';
              bak.textContent = Math.abs(bakiye).toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL 🔵';
            }
            item.appendChild(bak);
          }
          item.onclick = function(e) {
            e.stopPropagation();
            inp.value = c.ad;
            dropdown.style.display = 'none';
            onSec(c);
          };
          dropdown.appendChild(item);
        });
      }
      dropdown.style.display = 'block';
    }

    inp.addEventListener('input', function() {
      renderDropdown(inp.value);
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') dropdown.style.display = 'none';
    });
    document.addEventListener('click', function(e) {
      if (!wrap.contains(e.target)) dropdown.style.display = 'none';
    });

    wrap.appendChild(inp);
    wrap.appendChild(dropdown);
    return { wrap, inp };
  }

  function topluFaturaIrsaliyeSeç(cariAdi, irsaliyeler, wrapParent) {
    const seçimWrap = document.createElement('div');
    seçimWrap.style.cssText = 'margin-top:12px;border-top:1px solid var(--border);padding-top:12px;';

    const label = document.createElement('div');
    label.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
    label.textContent = cariAdi + ' — İrsaliye seçin:';
    seçimWrap.appendChild(label);

    const checkboxlar = [];
    irsaliyeler.forEach(function(irs) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:all 0.15s;';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.style.cssText = 'width:16px;height:16px;accent-color:var(--accent);cursor:pointer;';

      const info = document.createElement('div');
      info.style.cssText = 'flex:1;font-size:13px;';
      const plakaToplu = plakacikar(irs.aciklama);
      info.textContent = formatTarih(irs.tarih) + ' · ' + (irs.toplam_kg / 1000).toFixed(2) + ' ton' + (plakaToplu ? ' · 🚗 ' + plakaToplu : '');
      if (irs.kalemler && irs.kalemler.length > 1) {
        const alt = document.createElement('div');
        alt.style.cssText = 'font-size:11px;color:var(--muted);margin-top:2px;';
        alt.textContent = irs.kalemler.map(function(k) { return k.aciklama; }).join(', ');
        info.appendChild(alt);
      }

      row.appendChild(cb);
      row.appendChild(info);
      row.onclick = function(e) {
        // Checkbox'a direkt tıklanınca row.onclick'i tetikleme — çift toggle olmasın
        if (e.target === cb) return;
        cb.checked = !cb.checked;
        row.style.borderColor = cb.checked ? 'var(--accent)' : 'var(--border2)';
        row.style.background = cb.checked ? 'var(--accent-lt)' : '';
      };
      cb.onchange = function() {
        row.style.borderColor = cb.checked ? 'var(--accent)' : 'var(--border2)';
        row.style.background = cb.checked ? 'var(--accent-lt)' : '';
      };
      row.style.borderColor = 'var(--accent)';
      row.style.background = 'var(--accent-lt)';

      seçimWrap.appendChild(row);
      checkboxlar.push({ cb, irs });
    });

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.style.marginTop = '10px';

    const devamBtn = document.createElement('button');
    devamBtn.className = 'btn-primary';
    devamBtn.textContent = 'Devam →';
    devamBtn.onclick = function() {
      const secilen = checkboxlar.filter(function(x) { return x.cb.checked; }).map(function(x) { return x.irs; });
      if (secilen.length === 0) { addMessage('❌ En az bir irsaliye seçin.', 'bot'); return; }
      Array.from(seçimWrap.querySelectorAll('input,button')).forEach(function(el) { el.disabled = true; });
      addMessage('✅ ' + secilen.length + ' irsaliye seçildi — fiyat giriliyor…', 'user');
      topluFaturaFiyatAkisi(cariAdi, secilen, 0, []);
    };

    const iptalBtn = document.createElement('button');
    iptalBtn.className = 'btn-cancel';
    iptalBtn.textContent = '✕ İptal';
    iptalBtn.onclick = function() { addMessage('❌ İptal edildi.', 'bot'); };

    btnRow.appendChild(devamBtn);
    btnRow.appendChild(iptalBtn);
    seçimWrap.appendChild(btnRow);
    wrapParent.appendChild(seçimWrap);
  }

  let topluAkis = null;

  function topluFaturaFiyatAkisi(cariAdi, irsaliyeler, index, toplanmis) {
    if (index >= irsaliyeler.length) {
      // Tümü toplandı, fatura kes
      topluFaturaGonder(cariAdi, toplanmis);
      return;
    }
    const irs = irsaliyeler[index];
    const kalemler = irs.kalemler || [];

    topluAkis = {
      cariAdi, irsaliyeler, index, toplanmis,
      irs, kalemler,
      malzemeler: (function() { const obj = {}; kalemler.forEach(function(k) { obj[k.aciklama] = k.miktar_kg; }); return obj; })(),
      toplanan_fiyatlar: {},
      kalem_index: 0
    };

    if (kalemler.length > 1) {
      const ilk = kalemler[0];
      topluFiyatSor('🧾 [' + (index+1) + '/' + irsaliyeler.length + '] ' + irs.cari_adi + '\n' + ilk.aciklama + ' fiyatı?\n(' + ilk.miktar_kg.toLocaleString('tr-TR') + ' kg)');
    } else {
      topluFiyatSor('🧾 [' + (index+1) + '/' + irsaliyeler.length + '] ' + formatTarih(irs.tarih) + ' — ' + (irs.toplam_kg/1000).toFixed(2) + ' ton\nBirim fiyat? (TL/kg)');
    }
  }

  function topluFiyatSor(mesaj) {
    const wrap = document.createElement('div');
    wrap.className = 'fiyat-input-wrap';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'fiyat-input';
    inp.placeholder = 'Örn: 14.85 veya 14850';
    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = 'Gönder';
    const iptalBtn = document.createElement('button');
    iptalBtn.className = 'btn-cancel';
    iptalBtn.textContent = '✕ İptal';
    iptalBtn.onclick = function() {
      inp.disabled = true; btn.disabled = true; iptalBtn.disabled = true;
      topluAkis = null;
      addMessage('❌ Toplu fatura iptal edildi.', 'bot');
    };
    const fiyatHintT = document.createElement('div');
    fiyatHintT.style.cssText = 'font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.6;';
    fiyatHintT.innerHTML = '&#128161; Ondalık için <b>virgül</b>: 14,4458 &nbsp;&middot;&nbsp; Binlik için <b>nokta</b>: 14.850';

    const fiyatHataT = document.createElement('div');
    fiyatHataT.style.cssText = 'font-size:11px;color:#e53e3e;margin-top:5px;display:none;';
    fiyatHataT.textContent = 'Geçersiz fiyat. Örnek: 14,85 veya 14.850 veya 14,4458';

    const gonder = function() {
      const deger = inp.value.trim();
      if (!deger || !parseFiyat(deger)) {
        fiyatHataT.style.display = 'block';
        inp.style.borderColor = '#e53e3e';
        return;
      }
      fiyatHataT.style.display = 'none';
      inp.style.borderColor = '';
      inp.disabled = true; btn.disabled = true; iptalBtn.disabled = true;
      topluFiyatGirildi(deger);
    };
    btn.onclick = gonder;
    inp.onkeydown = function(e) { if (e.key === 'Enter') gonder(); };
    inp.oninput = function() { fiyatHataT.style.display = 'none'; inp.style.borderColor = ''; };
    wrap.appendChild(inp);
    wrap.appendChild(btn);
    wrap.appendChild(iptalBtn);
    wrap.appendChild(fiyatHintT);
    wrap.appendChild(fiyatHataT);
    addMessage(mesaj, 'bot', wrap);
    setTimeout(function() { inp.focus(); }, 100);
  }

  function topluFiyatGirildi(deger) {
    if (!topluAkis) return;
    addMessage(deger, 'user');
    const fiyat = parseFiyat(deger);
    if (!fiyat) {
      addMessage('❌ Geçersiz fiyat.', 'bot');
      topluFiyatSor('💰 Tekrar deneyin:');
      return;
    }
    const { cariAdi, irsaliyeler, index, toplanmis, irs, kalemler, malzemeler, toplanan_fiyatlar } = topluAkis;
    const kalem_index = topluAkis.kalem_index;

    if (kalemler.length > 1) {
      const mevcut = kalemler[kalem_index];
      toplanan_fiyatlar[mevcut.aciklama] = fiyat;
      const sonraki = kalem_index + 1;
      if (sonraki < kalemler.length) {
        topluAkis.kalem_index = sonraki;
        const sm = kalemler[sonraki];
        topluFiyatSor('✅ ' + mevcut.aciklama + ': ' + fiyatGoster(fiyat) + ' TL/kg\n\n💰 ' + sm.aciklama + ' fiyatı?\n(' + sm.miktar_kg.toLocaleString('tr-TR') + ' kg)');
      } else {
        const yeni = toplanmis.concat([{ parasut_irsaliye_id: irs.parasut_irsaliye_id, malzemeler, toplanan_fiyatlar, agirlik_kg: irs.toplam_kg }]);
        topluFaturaFiyatAkisi(cariAdi, irsaliyeler, index + 1, yeni);
      }
    } else {
      const yeni = toplanmis.concat([{ parasut_irsaliye_id: irs.parasut_irsaliye_id, malzemeler: {}, toplanan_fiyatlar: { 'hurda': fiyat }, agirlik_kg: irs.toplam_kg }]);
      topluFaturaFiyatAkisi(cariAdi, irsaliyeler, index + 1, yeni);
    }
  }

  async function topluFaturaGonder(cariAdi, irsaliyelerData) {
    showTyping();
    try {
      const res = await fetch('/api/toplu-fatura-kes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cari_adi: cariAdi, irsaliyeler: irsaliyelerData })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.cevap, 'bot');
      topluAkis = null;
    } catch {
      removeTyping();
      addMessage('❌ Toplu fatura kesilemedi, tekrar deneyin.', 'bot');
      topluAkis = null;
    }
  }

  // ── YENİ CARİ FORMU ──────────────────────────────────────────────

  function cariFormGoster() {
    const wrap = document.createElement('div');
    const baslik = document.createElement('div');
    baslik.style.cssText = 'font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px;';
    baslik.textContent = '➕ Yeni Cari Oluştur';
    wrap.appendChild(baslik);
    const cariInfo = document.createElement('div');
    cariInfo.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;padding:8px 12px;background:var(--accent-lt);border-radius:8px;border-left:3px solid var(--accent);';
    cariInfo.textContent = 'Yeni müşteri bilgilerini doldurun. Yıldızlı (*) alanlar zorunludur.';
    wrap.appendChild(cariInfo);

    const formWrap = document.createElement('div');
    formWrap.className = 'form-wrap';
    const alanlar = [
      { key: 'firma_adi',     label: 'Firma adı *',    placeholder: 'Firma adı',         required: true  },
      { key: 'email',         label: 'Email',           placeholder: 'firma@mail.com',     required: false },
      { key: 'telefon',       label: 'Telefon',         placeholder: '05XX XXX XX XX',     required: false },
      { key: 'vergi_no',      label: 'Vergi No',        placeholder: '1234567890',         required: false },
      { key: 'vergi_dairesi', label: 'Vergi Dairesi',   placeholder: 'Vergi dairesi adı',  required: false },
      { key: 'adres',         label: 'Adres',           placeholder: 'Açık adres',         required: false }
    ];
    const inputs = {};
    alanlar.forEach(function(alan) {
      const row = document.createElement('div');
      row.className = 'form-row';
      const label = document.createElement('span');
      label.className = 'form-label';
      label.textContent = alan.label;
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'form-input' + (alan.required ? ' required' : '');
      inp.placeholder = alan.placeholder;
      inputs[alan.key] = inp;
      row.appendChild(label);
      row.appendChild(inp);
      formWrap.appendChild(row);
    });

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    const kaydetBtn = document.createElement('button');
    kaydetBtn.className = 'btn-primary';
    kaydetBtn.textContent = 'Cari Oluştur';
    kaydetBtn.onclick = async function() {
      const firmaAdi = inputs.firma_adi.value.trim();
      if (!firmaAdi) { inputs.firma_adi.style.borderColor = '#e53e3e'; addMessage('❌ Firma adı zorunludur.', 'bot'); return; }
      kaydetBtn.disabled = true;
      kaydetBtn.textContent = 'Oluşturuluyor…';
      addMessage('Yeni cari: ' + firmaAdi, 'user');
      try {
        const res = await fetch('/api/cari-olustur', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firma_adi: firmaAdi,
            email: inputs.email.value.trim() || null,
            telefon: inputs.telefon.value.trim() || null,
            vergi_no: inputs.vergi_no.value.trim() || null,
            vergi_dairesi: inputs.vergi_dairesi.value.trim() || null,
            adres: inputs.adres.value.trim() || null
          })
        });
        const data = await res.json();
        addMessage(data.cevap, 'bot');
      } catch {
        addMessage('❌ Cari oluşturulamadı, tekrar deneyin.', 'bot');
        kaydetBtn.disabled = false;
        kaydetBtn.textContent = 'Cari Oluştur';
      }
    };
    const iptalBtn = document.createElement('button');
    iptalBtn.className = 'btn-cancel';
    iptalBtn.textContent = '✕ İptal';
    iptalBtn.onclick = function() { addMessage('❌ Cari oluşturma iptal edildi.', 'bot'); };
    btnRow.appendChild(kaydetBtn);
    btnRow.appendChild(iptalBtn);
    formWrap.appendChild(btnRow);
    wrap.appendChild(formWrap);

    addMessage('', 'bot', wrap);
    setTimeout(function() { inputs.firma_adi.focus(); }, 100);
  }

  // ── İRSALİYE SEÇ → FİYAT AKIŞI ──────────────────────────────────

  function irsaliyeSecildi(irs, wrap) {
    if (wrap) Array.from(wrap.querySelectorAll('button')).forEach(function(b) { b.disabled = true; });
    addMessage('✅ Seçildi: ' + irs.cari_adi + ' — ' + (irs.toplam_kg / 1000).toFixed(2) + ' ton', 'user');
    const kalemler = irs.kalemler || [];
    if (kalemler.length > 1) {
      faturaAkisi = {
        irs: irs,
        malzeme_listesi: kalemler.map(function(k) { return k.aciklama; }),
        malzemeler: (function() {
          const obj = {};
          kalemler.forEach(function(k) { obj[k.aciklama] = k.miktar_kg; });
          return obj;
        })(),
        toplanan_fiyatlar: {},
        index: 0,
        otomatik_kalan: null,
        otomatik_index: 0
      };
      const ilk = kalemler[0];
      fiyatSor(ilk.aciklama + ' fiyatı nedir?\n(' + ilk.miktar_kg.toLocaleString('tr-TR') + ' kg / ' + (ilk.miktar_kg / 1000).toFixed(2) + ' ton)\nÖrnek: 14.85 veya 14850');
    } else {
      faturaAkisi = { irs: irs, malzeme_listesi: [], malzemeler: {}, toplanan_fiyatlar: {}, index: 0, otomatik_kalan: null, otomatik_index: 0 };
      fiyatSor('💰 Birim fiyatı nedir? (TL/kg)\n⚖️ ' + (irs.toplam_kg / 1000).toFixed(2) + ' ton\nÖrnek: 14.85 veya 14850');
    }
  }

  function fiyatSor(mesaj) {
    const wrap = document.createElement('div');
    wrap.className = 'fiyat-input-wrap';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'fiyat-input';
    inp.placeholder = 'Örn: 14.85 veya 14850';

    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = 'Gönder';

    // ── İPTAL BUTONU ──
    const iptalBtn = document.createElement('button');
    iptalBtn.className = 'btn-cancel';
    iptalBtn.textContent = '✕ İptal';
    iptalBtn.onclick = function() {
      inp.disabled = true;
      btn.disabled = true;
      iptalBtn.disabled = true;
      faturaAkisi = null;
      addMessage('❌ Fatura işlemi iptal edildi.', 'bot');
    };

    // Hint notu
    const fiyatHint2 = document.createElement('div');
    fiyatHint2.style.cssText = 'font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.6;';
    fiyatHint2.innerHTML = '💡 Ondalık için <b>virgül</b>: 14,4458 &nbsp;·&nbsp; Binlik için <b>nokta</b>: 14.850';

    // Hata mesajı
    const fiyatHata2 = document.createElement('div');
    fiyatHata2.style.cssText = 'font-size:11px;color:#e53e3e;margin-top:5px;display:none;';
    fiyatHata2.textContent = '⚠️ Geçersiz fiyat. Örnek: 14,85 · 14.850 · 14,4458';

    const gonder = function() {
      const deger = inp.value.trim();
      if (!deger) {
        fiyatHata2.style.display = 'block';
        inp.style.borderColor = '#e53e3e';
        return;
      }
      const fiyat = parseFiyat(deger);
      if (!fiyat) {
        fiyatHata2.style.display = 'block';
        inp.style.borderColor = '#e53e3e';
        return;
      }
      fiyatHata2.style.display = 'none';
      inp.style.borderColor = '';
      inp.disabled = true;
      btn.disabled = true;
      iptalBtn.disabled = true;
      fiyatGirildi(deger);
    };
    btn.onclick = gonder;
    inp.onkeydown = function(e) { if (e.key === 'Enter') gonder(); };
    inp.oninput = function() { fiyatHata2.style.display = 'none'; inp.style.borderColor = ''; };

    wrap.appendChild(inp);
    wrap.appendChild(btn);
    wrap.appendChild(iptalBtn);
    wrap.appendChild(fiyatHint2);
    wrap.appendChild(fiyatHata2);
    addMessage(mesaj, 'bot', wrap);
    setTimeout(function() { inp.focus(); }, 100);
  }

  async function fiyatGirildi(deger) {
    if (!faturaAkisi) return;
    addMessage(deger, 'user');
    const fiyat = parseFiyat(deger);
    if (!fiyat) {
      addMessage('❌ Geçersiz fiyat. Örnek: 14.85 veya 14850', 'bot');
      fiyatSor('💰 Tekrar deneyin:');
      return;
    }
    const irs              = faturaAkisi.irs;
    const malzeme_listesi  = faturaAkisi.malzeme_listesi;
    const malzemeler       = faturaAkisi.malzemeler;
    const toplanan_fiyatlar = faturaAkisi.toplanan_fiyatlar;
    const index            = faturaAkisi.index;
    const otomatik_kalan   = faturaAkisi.otomatik_kalan;
    const otomatik_index   = faturaAkisi.otomatik_index;

    if (malzeme_listesi.length > 0) {
      const mevcut    = malzeme_listesi[index];
      const mevcut_kg = malzemeler[mevcut] || 0;
      toplanan_fiyatlar[mevcut] = fiyat;
      const sonraki = index + 1;
      if (sonraki < malzeme_listesi.length) {
        faturaAkisi.index = sonraki;
        const sm = malzeme_listesi[sonraki];
        const sk = malzemeler[sm] || 0;
        fiyatSor('✅ ' + mevcut + ' (' + mevcut_kg.toLocaleString('tr-TR') + ' kg): ' + fiyatGoster(fiyat) + ' TL/kg kaydedildi.\n\n💰 ' + sm + ' fiyatı nedir?\n(' + sk.toLocaleString('tr-TR') + ' kg / ' + (sk / 1000).toFixed(2) + ' ton)');
      } else {
        await faturaKesVeDevam(irs, malzemeler, toplanan_fiyatlar, null, otomatik_kalan, otomatik_index);
      }
    } else {
      await faturaKesVeDevam(irs, {}, { 'hurda': fiyat }, irs.toplam_kg, otomatik_kalan, otomatik_index);
    }
  }

  async function faturaKesVeDevam(irs, malzemeler, toplanan_fiyatlar, agirlik_kg, otomatik_kalan, otomatik_index) {
    showTyping();
    try {
      const res = await fetch('/api/fatura-kes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          parasut_irsaliye_id: irs.parasut_irsaliye_id,
          cari_adi: irs.cari_adi,
          agirlik_kg: agirlik_kg || irs.toplam_kg,
          malzemeler: malzemeler,
          toplanan_fiyatlar: toplanan_fiyatlar
        })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.cevap, 'bot');
      faturaAkisi = null;
      if (!data.basarili) return;
      if (otomatik_kalan && otomatik_index < otomatik_kalan.length) {
        setTimeout(function() { tumunuSiralaKes(otomatik_kalan, otomatik_index); }, 400);
      } else {
        await sonrakiIrsaliyeSor();
      }
    } catch {
      removeTyping();
      addMessage('❌ Fatura kesilemedi, tekrar deneyin.', 'bot');
      faturaAkisi = null;
    }
  }

  async function sonrakiIrsaliyeSor() {
    try {
      const res = await fetch('/api/bekleyen-irsaliyeler');
      const data = await res.json();
      if (!data.irsaliyeler || data.irsaliyeler.length === 0) {
        addMessage('🎉 Tüm irsaliyeler faturalandı!', 'bot');
        return;
      }
      const kalan = data.irsaliyeler;
      const wrap = document.createElement('div');
      const bilgi = document.createElement('div');
      bilgi.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;';
      bilgi.textContent = kalan.length + ' irsaliye daha bekliyor. Ne yapalım?';
      wrap.appendChild(bilgi);
      const btnRow = document.createElement('div');
      btnRow.className = 'btn-row';

      const devamBtn = document.createElement('button');
      devamBtn.className = 'btn-primary';
      devamBtn.textContent = '▶ Sıradaki (' + kalan[0].cari_adi.split(' ')[0] + ')';
      devamBtn.onclick = function() {
        Array.from(btnRow.querySelectorAll('button')).forEach(function(b) { b.disabled = true; });
        irsaliyeSecildi(kalan[0], null);
      };

      const hepsiBtn = document.createElement('button');
      hepsiBtn.className = 'btn-primary';
      hepsiBtn.style.background = '#1a3d28';
      hepsiBtn.textContent = '⚡ Hepsini kes (' + kalan.length + ')';
      hepsiBtn.onclick = function() {
        Array.from(btnRow.querySelectorAll('button')).forEach(function(b) { b.disabled = true; });
        tumunuSiralaKes(kalan, 0);
      };

      const durBtn = document.createElement('button');
      durBtn.className = 'btn-secondary';
      durBtn.textContent = '⏸ Dur';
      durBtn.onclick = function() {
        Array.from(btnRow.querySelectorAll('button')).forEach(function(b) { b.disabled = true; });
        addMessage(kalan.length + ' irsaliye beklemede kaldı.', 'bot');
      };

      btnRow.appendChild(devamBtn);
      btnRow.appendChild(hepsiBtn);
      btnRow.appendChild(durBtn);
      wrap.appendChild(btnRow);
      addMessage('', 'bot', wrap);
    } catch {}
  }

  function tumunuSiralaKes(irsaliyeler, index) {
    if (index >= irsaliyeler.length) {
      addMessage('🎉 Tüm irsaliyeler faturalandı!', 'bot');
      return;
    }
    const irs = irsaliyeler[index];
    const plakaOto = plakacikar(irs.aciklama);
    addMessage('⚡ Otomatik: ' + irs.cari_adi + (plakaOto ? ' · 🚗 ' + plakaOto : '') + ' (' + (irs.toplam_kg / 1000).toFixed(2) + ' ton)', 'bot');
    const kalemler = irs.kalemler || [];
    if (kalemler.length > 1) {
      faturaAkisi = {
        irs: irs,
        malzeme_listesi: kalemler.map(function(k) { return k.aciklama; }),
        malzemeler: (function() {
          const obj = {};
          kalemler.forEach(function(k) { obj[k.aciklama] = k.miktar_kg; });
          return obj;
        })(),
        toplanan_fiyatlar: {},
        index: 0,
        otomatik_kalan: irsaliyeler,
        otomatik_index: index + 1
      };
      const ilk = kalemler[0];
      fiyatSor(irs.cari_adi + ' — ' + ilk.aciklama + ' fiyatı?\n(' + ilk.miktar_kg.toLocaleString('tr-TR') + ' kg / ' + (ilk.miktar_kg / 1000).toFixed(2) + ' ton)');
    } else {
      faturaAkisi = {
        irs: irs,
        malzeme_listesi: [],
        malzemeler: {},
        toplanan_fiyatlar: {},
        index: 0,
        otomatik_kalan: irsaliyeler,
        otomatik_index: index + 1
      };
      fiyatSor(irs.cari_adi + ' — birim fiyat? (TL/kg)\n⚖️ ' + (irs.toplam_kg / 1000).toFixed(2) + ' ton');
    }
  }

  window.onload = function() { inputEl.focus(); };
</script>
</body>
</html>

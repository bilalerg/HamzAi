<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profaix - Sorgu Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="/static/css/chat.css" rel="stylesheet">
</head>
<body>

<div class="panel-overlay" id="panelOverlay" onclick="panelKapat()"></div>

<div class="quick-panel" id="quickPanel">
  <div class="panel-header">
    <div class="panel-header-title">Pro<em>faix</em></div>
    <button class="panel-close" onclick="panelKapat()">✕</button>
  </div>
  <div class="panel-body">

    <div class="panel-group open" data-pg="faturalar">
      <button type="button" class="panel-group-head" onclick="panelGrupTogle(this)">
        <span class="pg-icon">🧾</span><span class="pg-title">Faturalar</span><span class="pg-chev">▶</span>
      </button>
      <div class="panel-group-items">
        <button class="panel-btn" onclick="panelKapat();bekleyenIrsaliyeleriGoster()"><span class="btn-icon">📋</span> Bekleyen irsaliyeler</button>
        <button class="panel-btn" onclick="panelKapat();topluFaturaGoster()"><span class="btn-icon">🧾</span> Toplu fatura</button>
        <button class="panel-btn" onclick="panelKapat();faturaListesiGoster()"><span class="btn-icon">🔍</span> Fatura sorgula</button>
        <button class="panel-btn" onclick="panelKapat();alisFaturasiFormGoster()"><span class="btn-icon">📥</span> Alış faturası kes</button>
      </div>
    </div>

    <div class="panel-group" data-pg="kasa">
      <button type="button" class="panel-group-head" onclick="panelGrupTogle(this)">
        <span class="pg-icon">💵</span><span class="pg-title">Tahsilat & Ödeme</span><span class="pg-chev">▶</span>
      </button>
      <div class="panel-group-items">
        <button class="panel-btn" onclick="panelKapat();tahsilatFormGoster()"><span class="btn-icon">💵</span> Tahsilat ekle</button>
        <button class="panel-btn" onclick="panelKapat();odemeFormGoster()"><span class="btn-icon">💸</span> Ödeme ekle</button>
        <button class="panel-btn" onclick="panelKapat();paraTransferiFormGoster()"><span class="btn-icon">🔄</span> Para transferi</button>
        <button class="panel-btn" onclick="panelKapat();hesaplarGoster()"><span class="btn-icon">🏦</span> Kasa / banka hesapları</button>
      </div>
    </div>

    <div class="panel-group" data-pg="cariler">
      <button type="button" class="panel-group-head" onclick="panelGrupTogle(this)">
        <span class="pg-icon">👥</span><span class="pg-title">Cariler</span><span class="pg-chev">▶</span>
      </button>
      <div class="panel-group-items">
        <button class="panel-btn" onclick="panelKapat();cariFormGoster()"><span class="btn-icon">➕</span> Yeni cari</button>
        <button class="panel-btn" onclick="panelKapat();bakiyeleriGoster()"><span class="btn-icon">💰</span> Müşteri bakiyeleri</button>
      </div>
    </div>

    <div class="panel-group" data-pg="raporlar">
      <button type="button" class="panel-group-head" onclick="panelGrupTogle(this)">
        <span class="pg-icon">📊</span><span class="pg-title">Raporlar</span><span class="pg-chev">▶</span>
      </button>
      <div class="panel-group-items">
        <button class="panel-btn" onclick="panelKapat();hesapOzetiGoster()"><span class="btn-icon">📊</span> Hesap özeti</button>
        <button class="panel-btn" onclick="panelKapat();gunlukOzetGoster()"><span class="btn-icon">📈</span> Günlük özet</button>
        <button class="panel-btn" onclick="panelKapat();gelirGiderRaporuGoster()"><span class="btn-icon">📉</span> Gelir/Gider raporu</button>
        <button class="panel-btn" onclick="panelKapat();stokHareketleriGoster()"><span class="btn-icon">📦</span> Stok hareketleri</button>
        <button class="panel-btn" onclick="panelKapat();sonFisleriGoster()"><span class="btn-icon">🗂️</span> Son yüklenen fişler</button>
      </div>
    </div>

    <div class="panel-group" data-pg="sistem">
      <button type="button" class="panel-group-head" onclick="panelGrupTogle(this)">
        <span class="pg-icon">⚙️</span><span class="pg-title">Sistem</span><span class="pg-chev">▶</span>
      </button>
      <div class="panel-group-items">
        <button class="panel-btn" onclick="cacheYenile(this)"><span class="btn-icon">🔄</span> Bakiyeleri yenile</button>
      </div>
    </div>

  </div>
</div>

<div class="panel-toggle" id="panelToggle" onclick="panelAc()" title="Menü">
  <svg viewBox="0 0 14 14"><line x1="2" y1="4" x2="12" y2="4"/><line x1="2" y1="7" x2="12" y2="7"/><line x1="2" y1="10" x2="12" y2="10"/></svg>
</div>

<div class="header">
  <div class="logo-img">
    <img src="/static/img/logo.jpg" alt="Profaix" style="height:52px;width:auto;display:block;">
  </div>
  <div class="sep"></div>
  <div class="header-label">Sorgu Paneli</div>
  <a href="https://profaix.com/panel" target="_top" style="display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--accent);border-radius:100px;text-decoration:none;font-size:12px;font-weight:500;color:#fff;transition:opacity 0.15s;" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Panele Dön
  </a>
  <button id="clearChatBtn" onclick="sohbetiSil()" title="Sohbeti Sil" style="margin-left:8px;display:flex;align-items:center;gap:5px;padding:5px 11px;background:transparent;border:1.5px solid var(--border2);border-radius:100px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all 0.15s;" onmouseover="this.style.background='rgba(220,38,38,0.08)';this.style.color='#dc2626';this.style.borderColor='rgba(220,38,38,0.35)';" onmouseout="this.style.background='transparent';this.style.color='var(--text2)';this.style.borderColor='var(--border2)';">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    Sohbeti Sil
  </button>
  <div id="userPill" style="margin-left:8px;display:flex;align-items:center;">
    <span id="userAdSoyad" style="font-size:12px;font-weight:500;color:var(--text2);"></span>
  </div>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <h2>İyi günler, <em id="welcomeAd"></em></h2>
    <p>Muhasebe işlemleri için buradayım. Ne yapalım?</p>
  </div>
</div>

<div class="input-area" id="inputArea">
  <div class="input-box">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Fiş fotoğrafı yükle">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadFis(this)">
    <textarea id="chatInput" placeholder="Mesajınızı yazın veya fiş fotoğrafı yükleyin…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()" id="sendBtn" title="Gönder">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="input-hint">📎 Fiş yükle &nbsp;·&nbsp; Enter → gönder &nbsp;·&nbsp; Shift+Enter → yeni satır</div>
</div>

<script src="/static/js/01-state.js"></script>
<script src="/static/js/02-core.js"></script>
<script src="/static/js/03-session.js"></script>
<script src="/static/js/04-chat.js"></script>
<script src="/static/js/05-rapor.js"></script>
<script src="/static/js/06-fatura.js"></script>
<script src="/static/js/07-tahsilat.js"></script>
<script src="/static/js/08-cari.js"></script>
<script src="/static/js/09-bootstrap.js"></script>
</body>
</html>

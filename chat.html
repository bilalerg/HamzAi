<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profaix — Sorgu Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --border2: #3d444d;
    --accent: #4f8ef7;
    --accent2: #79a8f9;
    --accent-lt: rgba(79,142,247,0.12);
    --accent-dim: rgba(79,142,247,0.08);
    --text: #e6edf3;
    --text2: #8b949e;
    --muted: #6e7681;
    --muted2: #484f58;
    --user-bg: #1f6feb;
    --alacak: #58a6ff;
    --s1: 0 1px 3px rgba(0,0,0,0.3);
    --s2: 0 4px 16px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.2);
    --s3: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
    --r: 12px;
    --r2: 18px;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── HEADER ── */
  .header {
    padding: 0 32px;
    height: 64px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    box-shadow: var(--s1);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }
  .logo-img { display:flex; align-items:center; }
  .logo-text {
    font-family: 'Sora', sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .logo-text em { font-style: italic; color: var(--accent); }
  .sep { width: 1px; height: 20px; background: var(--border2); }
  .header-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--accent-lt);
    border: 1px solid rgba(191,91,42,0.2);
    padding: 5px 13px;
    border-radius: 100px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.5; transform:scale(0.85); }
  }
  .status-label { font-size: 11px; font-weight: 500; color: var(--accent); letter-spacing: 0.2px; }

  /* ── MESSAGES ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
    justify-content: center;
    transition: justify-content 0s;
  }
  .messages.chat-started {
    justify-content: flex-start;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: var(--bg); }
  .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* ── WELCOME ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 24px 28px;
    gap: 10px;
    animation: fadeInUp 0.5s ease both;
    width: 100%;
    max-width: 660px;
    margin: 0 auto;
  }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .welcome-icon { display: none; }
  .welcome h2 {
    font-family: 'Sora', sans-serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.4px;
    line-height: 1.25;
  }
  .welcome h2 em { font-style: normal; color: var(--accent); font-weight: 600; }
  .welcome p { font-size: 13px; color: var(--muted); line-height: 1.7; max-width: 320px; font-weight: 400; }

  /* Başlangıçta input-area welcome ile birlikte ortada */
  .messages:not(.chat-started) ~ .input-area {
    border-top: none;
    background: transparent;
    padding: 0 40px 32px;
  }
  .messages:not(.chat-started) ~ .input-area .input-box {
    max-width: 660px;
    margin: 0 auto;
    background: var(--surface2);
    border-color: var(--border2);
    box-shadow: var(--s3);
  }
  .messages:not(.chat-started) ~ .input-area .input-hint {
    text-align: center;
  }
  .quick-section { width: 100%; max-width: 540px; }
  .quick-label {
    font-size: 10px;
    color: var(--muted2);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: left;
    font-weight: 500;
  }
  .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .quick-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    padding: 8px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--s1);
  }
  .quick-btn:hover {
    background: var(--accent-lt);
    border-color: rgba(191,91,42,0.3);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--s2);
  }
  .quick-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .quick-btn.primary:hover { background: #a84b22; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(191,91,42,0.35); }

  /* ── MESSAGES ── */
  .message {
    display: flex;
    flex-direction: column;
    max-width: 74%;
    animation: msgIn 0.3s cubic-bezier(0.34,1.4,0.64,1);
  }
  @keyframes msgIn {
    from { opacity:0; transform: translateY(10px) scale(0.96); }
    to   { opacity:1; transform: none; }
  }
  .message.user { align-self: flex-end; }
  .message.bot  { align-self: flex-start; }
  .msg-meta { font-size: 10px; color: var(--muted2); margin-bottom: 5px; letter-spacing: 0.2px; }
  .message.user .msg-meta { text-align: right; }
  .bubble {
    padding: 13px 17px;
    font-size: 13.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
    font-weight: 400;
  }
  .message.user .bubble {
    background: var(--user-bg);
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 3px 14px rgba(191,91,42,0.28);
  }
  .message.bot .bubble {
    background: var(--surface);
    color: var(--text);
    border-radius: 4px 18px 18px 18px;
    border: 1px solid var(--border);
    box-shadow: var(--s2);
  }

  /* ── BUTONLAR ── */
  .firma-btn {
    margin-top: 7px;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--accent);
    border: 1.5px solid rgba(191,91,42,0.25);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    width: 100%;
    transition: all 0.18s;
    text-align: left;
  }
  .firma-btn:hover { background: var(--accent-lt); border-color: var(--accent); transform: translateX(2px); }
  .irsaliye-btn {
    margin-top: 7px;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    width: 100%;
    transition: all 0.18s;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .irsaliye-btn:hover { background: var(--accent-lt); border-color: rgba(191,91,42,0.3); color: var(--accent); transform: translateX(2px); }
  .irsaliye-btn .kg { font-size: 11px; color: var(--muted); font-weight: 400; }
  .cari-btn {
    margin-top: 7px;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    width: 100%;
    transition: all 0.18s;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cari-btn:hover { background: var(--accent-lt); border-color: rgba(191,91,42,0.3); color: var(--accent); }
  .cari-btn .bakiye { font-size: 12px; font-weight: 600; }
  .cari-btn .bakiye.alacak { color: var(--alacak); }
  .cari-btn .bakiye.sifir { color: var(--muted2); }
  .cari-row {
    margin-top: 7px;
    padding: 11px 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    transition: all 0.15s;
  }
  .cari-row:hover { border-color: rgba(191,91,42,0.25); box-shadow: var(--s1); }
  .cari-row .cari-ad { font-weight: 500; color: var(--text); }
  .cari-row .cari-bakiye { font-weight: 600; font-size: 13px; }
  .cari-row .cari-bakiye.alacak { color: var(--alacak); }
  .cari-row .cari-bakiye.sifir { color: var(--muted2); }
  .form-wrap { margin-top: 10px; display: flex; flex-direction: column; gap: 9px; }
  .form-row { display: flex; gap: 9px; align-items: center; }
  .form-label { font-size: 11px; color: var(--muted); min-width: 80px; text-align: right; }
  .form-input {
    flex: 1;
    padding: 9px 13px;
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    background: var(--bg);
    transition: border-color 0.18s, box-shadow 0.18s;
    color: var(--text);
  }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .form-input.required { border-color: rgba(191,91,42,0.35); }
  .fiyat-input-wrap { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fiyat-input {
    flex: 1;
    min-width: 100px;
    padding: 10px 13px;
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    background: var(--bg);
    transition: border-color 0.18s, box-shadow 0.18s;
    color: var(--text);
  }
  .fiyat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .btn-primary {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-primary:hover { background: #a84b22; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(191,91,42,0.32); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary {
    padding: 10px 20px;
    background: var(--surface2);
    color: var(--text2);
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-secondary:hover { background: var(--border); color: var(--text); }
  .btn-cancel {
    padding: 10px 15px;
    background: transparent;
    color: #c0392b;
    border: 1.5px solid rgba(192,57,43,0.25);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-cancel:hover { background: #fff5f5; border-color: #c0392b; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .img-bubble {
    background: var(--user-bg);
    padding: 6px;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 3px 14px rgba(191,91,42,0.28);
    display: inline-block;
  }
  .img-bubble img { max-width: 220px; max-height: 180px; border-radius: 10px; display: block; }

  /* ── TYPING ── */
  .typing-wrap {
    display: flex;
    flex-direction: column;
    max-width: 74%;
    align-self: flex-start;
    animation: msgIn 0.3s cubic-bezier(0.34,1.4,0.64,1);
  }
  .typing-bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 18px 18px 18px;
    padding: 15px 20px;
    display: flex;
    gap: 6px;
    align-items: center;
    box-shadow: var(--s2);
    width: fit-content;
  }
  .typing-bubble span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted2);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.16s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity:0.4; }
    30% { transform: translateY(-6px); opacity:1; }
  }

  /* ── INPUT AREA ── */
  .input-area {
    padding: 14px 40px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1.5px solid var(--border2);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 24px;
    line-height: 1.6;
    padding: 3px 0;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  textarea::-webkit-scrollbar { display: none; }
  textarea::placeholder { color: var(--muted2); }
  .upload-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .upload-btn:hover { background: var(--surface2); border-color: var(--border2); }
  .upload-btn svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .upload-btn:hover svg { stroke: var(--text2); }
  .send-btn {
    width: 36px; height: 36px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .send-btn:hover { background: var(--accent2); transform: scale(1.05); box-shadow: 0 4px 14px rgba(79,142,247,0.4); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .input-hint { font-size: 10.5px; color: var(--muted2); margin-top: 8px; padding-left: 4px; }

  /* ── CARİ DROPDOWN ── */
  .cari-search-wrap { position: relative; margin-bottom: 10px; }
  .cari-search-input {
    width: 100%;
    padding: 10px 13px;
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .cari-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .cari-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    box-shadow: var(--s3);
    z-index: 100;
    max-height: 220px;
    overflow-y: auto;
    animation: dropIn 0.15s ease;
  }
  @keyframes dropIn {
    from { opacity:0; transform: translateY(-6px); }
    to   { opacity:1; transform: none; }
  }
  .cari-dropdown-item {
    padding: 10px 15px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.12s;
  }
  .cari-dropdown-item:hover, .cari-dropdown-item.active { background: var(--accent-lt); }
  .cari-dropdown-item .dd-bakiye { font-size: 12px; font-weight: 600; color: var(--alacak); }
  .cari-dropdown-empty { padding: 10px 15px; font-size: 12px; color: var(--muted); }

  /* ── QUICK PANEL ── */
  .panel-overlay {
    position: fixed; inset: 0;
    background: rgba(30,20,16,0.35);
    backdrop-filter: blur(2px);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .panel-overlay.open { opacity: 1; pointer-events: all; }
  .quick-panel {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 272px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    box-shadow: var(--s3);
    z-index: 201;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .quick-panel.open { transform: translateX(0); }
  .panel-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .panel-header-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 400; color: var(--text); letter-spacing: -0.2px; }
  .panel-header-title em { font-style: italic; color: var(--accent); }
  .panel-close {
    width: 32px; height: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 15px;
    transition: all 0.15s;
  }
  .panel-close:hover { background: var(--accent-lt); color: var(--accent); }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px 14px; }
  .panel-section-label {
    font-size: 9.5px;
    color: var(--muted2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
    margin-top: 16px;
    padding-left: 4px;
    font-weight: 500;
  }
  .panel-section-label:first-child { margin-top: 0; }
  .panel-btn {
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--text2);
    cursor: pointer;
    text-align: left;
    margin-bottom: 2px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-btn:hover {
    background: var(--accent-lt);
    border-color: rgba(191,91,42,0.18);
    color: var(--accent);
    transform: translateX(3px);
  }
  .panel-btn .btn-icon { font-size: 15px; flex-shrink: 0; }

  .panel-toggle {
    position: fixed;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 56px;
    background: var(--accent);
    border-radius: 0 12px 12px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 199;
    box-shadow: 3px 0 12px rgba(191,91,42,0.28);
    transition: all 0.2s;
  }
  .panel-toggle:hover { width: 32px; background: #a84b22; }
  .panel-toggle svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

  @media(max-width:600px) {
    .quick-panel { width: 84vw; }
    .header, .messages, .input-area { padding-left: 16px; padding-right: 16px; }

<div class="input-area" id="inputArea">
  <div class="input-box">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Fiş fotoğrafı yükle">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadFis(this)">
    <textarea id="chatInput" placeholder="Mesajınızı yazın veya fiş fotoğrafı yükleyin…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()" id="sendBtn" title="Gönder">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="input-hint">📎 Fiş yükle &nbsp;·&nbsp; Enter → gönder &nbsp;·&nbsp; Shift+Enter → yeni satır</div>
</div>

<script>
  const SESSION_ID = (function() {
    let sid = localStorage.getItem('profaix_session_id');
    if (!sid) {
      sid = 'web_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('profaix_session_id', sid);
    }
    return sid;
  })();

  // ── KULLANICI BİLGİSİ ──────────────────────────────────────────────
  // Sayfa açılınca /api/me'den kim olduğunu öğren, header'a yaz
  (async function() {
    try {
      const res = await fetch('/api/me');
      const user = await res.json();
      if (user.giris_yapildi) {
        const ad = user.ad_soyad || user.username || '';
        document.getElementById('userAdSoyad').textContent = ad;

        const wadEl = document.getElementById('welcomeAd');
        if (wadEl) wadEl.textContent = ad.split(' ')[0] || ad;
      }
    } catch {}
  })();

  async function cikisYap() {
    try {
      await fetch('/api/logout', { method: 'POST' });
    } catch {}
    window.location.href = '/login';
  }
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('chatInput');
  const sendBtn    = document.getElementById('sendBtn');
  let faturaAkisi  = null;
  let _aktifPanel  = null; // Aktif panel elementi

  function _panelKapat() {
    if (_aktifPanel) {
      _aktifPanel.querySelectorAll('button, input, select').forEach(function(el) {
        el.disabled = true;
        el.style.opacity = '0.4';
        el.style.cursor = 'not-allowed';
      });
      _aktifPanel.style.opacity = '0.5';
      _aktifPanel = null;
    }
  }

  // ── GÜNLÜK ÖZET ──────────────────────────────────────────────────

  async function gunlukOzetGoster() {
    showTyping();
    try {
      const res = await fetch('/api/gunluk-ozet');
      const d = await res.json();
      removeTyping();
      const durum = d.bekleyen > 0
        ? `⚠️ ${d.bekleyen} fiş bekliyor`
        : '✅ Tüm fişler tamamlandı';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'font-size:13px;line-height:2;';
      wrap.innerHTML =
        `<b>📈 ${d.tarih} Günlük Özet</b><br>` +
        `📋 Yüklenen fiş: <b>${d.fis_sayisi}</b><br>` +
        `⚖️ Toplam ağırlık: <b>${(d.toplam_kg||0).toLocaleString('tr-TR')} kg</b><br>` +
        `✅ Tamamlanan: <b>${d.tamamlanan}</b><br>` +
        `🕐 Bekleyen: <b>${d.bekleyen}</b><br>` +
        `${durum}`;
      addMessage('', 'bot', wrap);
    } catch {
      removeTyping();
      addMessage('❌ Günlük özet yüklenemedi.', 'bot');
    }
  }

  // ── SON FİŞLER ───────────────────────────────────────────────────

  async function sonFisleriGoster() {
    showTyping();
    try {
      const res = await fetch('/api/son-fisler');
      const d = await res.json();
      removeTyping();
      if (!d.fisler || d.fisler.length === 0) {
        addMessage('📂 Henüz fiş yüklenmemiş.', 'bot');
        return;
      }
      const wrap = document.createElement('div');
      const baslik = document.createElement('div');
      baslik.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
      baslik.textContent = 'Son ' + d.fisler.length + ' yüklenen fiş:';
      wrap.appendChild(baslik);
      d.fisler.forEach(function(f) {
        const row = document.createElement('div');
        row.style.cssText = 'padding:8px 12px;background:var(--bg);border-radius:9px;margin-bottom:5px;font-size:12px;';
        const statusEmoji = f.status === 'TAMAMLANDI' ? '✅' : f.status === 'HATA' ? '❌' : '🕐';
        row.innerHTML =
          `<div style="display:flex;justify-content:space-between;margin-bottom:2px;">` +
          `<b style="font-size:13px;">${f.plaka}</b>` +
          `<span style="color:var(--muted)">${f.created_at}</span></div>` +
          `<div style="color:var(--muted)">${f.firma} · ${(f.agirlik_kg||0).toLocaleString('tr-TR')} kg · ${statusEmoji}</div>`;
        wrap.appendChild(row);
      });
      addMessage('🗂️ Son yüklenen fişler:', 'bot', wrap);
    } catch {
      removeTyping();
      addMessage('❌ Fişler yüklenemedi.', 'bot');
    }
  }

  // ── CACHE YENİLE ─────────────────────────────────────────────────

  async function cacheYenile(btn) {
    const orijinal = btn.innerHTML;
    btn.innerHTML = '<span class="btn-icon">⏳</span> Yenileniyor…';
    btn.disabled = true;
    try {
      await carileriGetir(true);  // Cache'i zorla yenile
      btn.innerHTML = '<span class="btn-icon">✅</span> Yenilendi!';
      setTimeout(function() {
        btn.innerHTML = orijinal;
        btn.disabled = false;
      }, 2000);
      panelKapat();
      addMessage('✅ Bakiyeler yenilendi.', 'bot');
    } catch {
      btn.innerHTML = orijinal;
      btn.disabled = false;
      addMessage('❌ Yenileme başarısız.', 'bot');
    }
  }

  // ── PANEL ────────────────────────────────────────────────────────
  function panelAc() {
    document.getElementById('quickPanel').classList.add('open');
    document.getElementById('panelOverlay').classList.add('open');
    document.getElementById('panelToggle').style.display = 'none';
  }
  function panelKapat() {
    document.getElementById('quickPanel').classList.remove('open');
    document.getElementById('panelOverlay').classList.remove('open');
    document.getElementById('panelToggle').style.display = 'flex';
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') panelKapat();
  });

  function formatTarih(tarih) {
    if (!tarih || tarih === '-') return tarih;
    const m = tarih.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[3] + '.' + m[2] + '.' + m[1];
    return tarih;
  }
  // ── FAZLA TAHSİLAT ONAY DIALOGU ─────────────────────────────────
  function tahsilatOnayDialogu(guncelBakiye, girilenTutar, cariAdi, onayCallback) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'background:#fffbeb;border:1.5px solid #f59e0b;border-radius:11px;padding:14px 16px;';

    const baslik = document.createElement('div');
    baslik.style.cssText = 'font-size:13px;font-weight:600;color:#92400e;margin-bottom:8px;';
    baslik.textContent = '⚠️ Fazla Tutar Uyarısı';
    wrap.appendChild(baslik);

    const bilgi = document.createElement('div');
    bilgi.style.cssText = 'font-size:12px;color:#78350f;line-height:1.8;margin-bottom:12px;';
    bilgi.innerHTML =
      '🏢 <b>' + cariAdi + '</b><br>' +
      '📊 Güncel bakiye: <b>' + guncelBakiye.toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL</b><br>' +
      '💰 Girilen tutar: <b>' + girilenTutar.toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL</b><br>' +
      '⚡ Fark: <b>' + (girilenTutar - guncelBakiye).toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL fazla</b><br><br>' +
      'Bu cari eksiye düşecek. Yine de devam etmek istiyor musunuz?';
    wrap.appendChild(bilgi);

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:8px;';

    const onayBtn = document.createElement('button');
    onayBtn.className = 'btn-primary';
    onayBtn.style.background = '#b45309';
    onayBtn.textContent = '✅ Evet, devam et';
    onayBtn.onclick = function() {
      onayBtn.disabled = true;
      iptalOnayBtn.disabled = true;
      onayCallback();
    };

    const iptalOnayBtn = document.createElement('button');
    iptalOnayBtn.className = 'btn-cancel';
    iptalOnayBtn.textContent = '✕ İptal';
    iptalOnayBtn.onclick = function() {
      onayBtn.disabled = true;
      iptalOnayBtn.disabled = true;
      addMessage('❌ Tahsilat iptal edildi.', 'bot');
    };

    btnRow.appendChild(onayBtn);
    btnRow.appendChild(iptalOnayBtn);
    wrap.appendChild(btnRow);

    addMessage('', 'bot', wrap);
  }

  function plakacikar(aciklama) {
    if (!aciklama) return null;
    const m = aciklama.match(/\b(\d{2}[A-Z]{1,3}\d{2,4})\b/i);
    return m ? m[1].toUpperCase() : null;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  var _welcomeRemoved = false;
  function removeWelcome() {
    if (_welcomeRemoved) return;
    const w = document.getElementById('welcome');
    if (w) {
      _welcomeRemoved = true;
      messagesEl.classList.add('chat-started');
      w.style.transition = 'opacity 0.2s ease';
      w.style.opacity = '0';
      setTimeout(function() { if(w.parentNode) w.remove(); }, 200);
    }
  }

  function now() {
    return new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, type, extraEl) {
    removeWelcome();
    if (extraEl && type === 'bot') {
      _panelKapat();
    }
    const wrap = document.createElement('div');
    wrap.className = 'message ' + type;
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = (type === 'user' ? 'Siz' : 'Profaix') + ' · ' + now();
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (text) bubble.textContent = text;
    if (extraEl) {
      bubble.appendChild(extraEl);
      if (type === 'bot') _aktifPanel = bubble;
    }
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    requestAnimationFrame(function() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
    return bubble;
  }

  function addImageMessage(src) {
    removeWelcome();
    const wrap = document.createElement('div');
    wrap.className = 'message user';
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.style.textAlign = 'right';
    meta.textContent = 'Siz · ' + now();
    const imgWrap = document.createElement('div');
    imgWrap.className = 'img-bubble';
    const img = document.createElement('img');
    img.src = src;
    img.style.cursor = 'pointer';
    img.onclick = () => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999;cursor:pointer;';
      const bigImg = document.createElement('img');
      bigImg.src = src;
      bigImg.style.cssText = 'max-width:90%;max-height:90%;border-radius:12px;';
      overlay.appendChild(bigImg);
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    };
    imgWrap.appendChild(img);
    wrap.appendChild(meta);
    wrap.appendChild(imgWrap);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    removeWelcome();
    removeTyping();
    const wrap = document.createElement('div');
    wrap.className = 'typing-wrap';
    wrap.id = 'typing';
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = 'Profaix yazıyor…';
    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    requestAnimationFrame(function() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function fiyatGoster(fiyat) {
    if (fiyat === null || fiyat === undefined) return '';
    let str = fiyat.toFixed(4).replace('.', ',').replace(/,?0+$/, '');
    let parcalar = str.split(',');
    parcalar[0] = parcalar[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return parcalar.join(',');
  }

  function parseFiyat(metin) {
    metin = metin.trim()
      .replace(/tl/gi, '').replace(/lira/gi, '').replace('₺', '').trim();
    if (/[^0-9.,]/.test(metin)) return null;
    metin = metin.replace(/\./g, '').replace(',', '.');
    const f = parseFloat(metin);
    return (f > 0) ? f : null;
  }

  // ── MESAJ YÖNLENDİRME ────────────────────────────────────────────

  const YONLENDIRME = [
    {
      fn: () => bekleyenIrsaliyeleriGoster(),
      kelimeler: [
        ['bekleyen', 'irsaliy'], ['bekleyen', 'fatura'], ['faturalanmamis'],
        ['faturalanmamış'], ['irsaliye', 'listele'], ['irsaliye', 'var mi'],
        ['irsaliye', 'var mı'], ['bekleyenler'], ['irsaliyeler'],

      kelimeler: [

        ['tahsilat ekle'], ['ödeme aldım'], ['odeme aldim'], ['para aldım'], ['para aldim'],
        ['ödeme ekle'], ['odeme ekle'], ['ödeme geldi'], ['odeme geldi'],
        ['para geldi'], ['tahsilat yap'], ['tahsil ettim'],
        ['para çek'], ['para cek'], ['yeni tahsilat'], ['ödeme al'],
        ['odeme al'], ['para tahsil'], ['tahsilat girişi'], ['tahsilat girisi'],
        ['tahsilat ekle']
      ]
    },
    {
      fn: () => topluFaturaGoster(),
      kelimeler: [

        ['müşteri ekle'], ['yeni firma']
      ]
    }
  ];

  function mesajYonlendir(text) {
    const lower = text.toLowerCase().trim();
    for (const kural of YONLENDIRME) {
      for (const grup of kural.kelimeler) {
        if (grup.every(k => lower.includes(k))) return kural;
      }
    }
    return null;
  }

  // ── INTENT → FONKSİYON HARİTASI ────────────────────────────────────
  const INTENT_MAP = {
    'bekleyen_irsaliyeler': (p) => bekleyenIrsaliyeleriGoster(),
    'toplu_fatura':         (p) => topluFaturaGoster(),
    'fatura_sorgula':       (p) => faturaListesiGoster(p.musteri),
    'tahsilat_ekle':        (p) => tahsilatFormGoster(p.musteri, p.tutar),
    'yeni_cari':            (p) => cariFormGoster(),
    'musteri_bakiyeleri':   (p) => bakiyeleriGoster(p.musteri),
    'hesap_ozeti':          (p) => hesapOzetiGoster(),
    'gunluk_ozet':          (p) => gunlukOzetGoster(),
    'son_fisler':           (p) => sonFisleriGoster(),
  };

  // ── CHAT ─────────────────────────────────────────────────────────

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    const eslesen = mesajYonlendir(text);
    if (eslesen) {
      addMessage(text, 'user');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      await eslesen.fn();
      return;
    }

    addMessage(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mesaj: text, session_id: SESSION_ID })
      });
      const data = await res.json();
      removeTyping();

      const intent = data.intent || 'none';
      const mesaj  = data.cevap  || '';
      const params = data.params || {};

      if (intent !== 'none' && INTENT_MAP[intent]) {
        if (mesaj) addMessage(mesaj, 'bot');
        await INTENT_MAP[intent](params);
      } else {
        addMessage(mesaj, 'bot');
      }

    } catch {
      removeTyping();
      addMessage('❌ Bağlantı hatası, lütfen tekrar deneyin.', 'bot');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function quickSend(text) {
    inputEl.value = text;
    sendMessage();
  }

  // ── FİŞ YÜKLE ────────────────────────────────────────────────────

  async function uploadFis(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => addImageMessage(e.target.result);
    reader.readAsDataURL(file);
    sendBtn.disabled = true;
    showTyping();
    const formData = new FormData();
    formData.append('file', file);
    formData.append('session_id', SESSION_ID);
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      const data = await res.json();
      removeTyping();
      if (data.bekliyor === 'firma_sec') {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;min-width:280px;max-width:420px;';

        const firmaCariler = (data.firma_listesi || []).map(function(f) {
          return { ad: f, bakiye: 0 };
        });

        const baslik = document.createElement('div');
        baslik.style.cssText = 'font-size:13px;color:var(--muted);margin-bottom:2px;';
        baslik.textContent = '🏭 Hangi firmaya ait?';
        wrap.appendChild(baslik);

        const { wrap: ddWrap, inp: ddInp } = cariSecimDropdown(firmaCariler, function(c) {
          firmaSecildi(data.ticket_id, c.ad, data.malzemeler, wrap);
        }, 'Firma adı yazın...');
        wrap.appendChild(ddWrap);

        const iptalBtn = document.createElement('button');
        iptalBtn.className = 'btn-cancel';
        iptalBtn.style.marginTop = '4px';
        iptalBtn.textContent = '✕ İptal';
        iptalBtn.onclick = function() {
          addMessage('❌ Fiş işlemi iptal edildi.', 'bot');
        };
        wrap.appendChild(iptalBtn);

        addMessage(data.cevap, 'bot', wrap);
        setTimeout(function() { ddInp.focus(); }, 100);
      } else {
        addMessage(data.cevap, 'bot');
      }
      inputEl.focus();
    } catch {
      removeTyping();
      addMessage('❌ Yükleme hatası, tekrar deneyin.', 'bot');
    } finally {
      sendBtn.disabled = false;
      input.value = '';
    }
  }

  // ── FİRMA SEÇ ────────────────────────────────────────────────────

  async function firmaSecildi(ticketId, firma, malzemeler, wrap) {
    if (wrap) Array.from(wrap.querySelectorAll('button')).forEach(function(b) { b.disabled = true; });
    addMessage('🏭 ' + firma, 'user');
    showTyping();
    try {
      const res = await fetch('/api/firma-sec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticket_id: ticketId, firma: firma, malzemeler: malzemeler, session_id: SESSION_ID })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.cevap, 'bot');
    } catch {
      removeTyping();
      addMessage('❌ Hata oluştu, tekrar deneyin.', 'bot');
    }
    inputEl.focus();
  }

  // ── BEKLEYENİRSALİYELER ──────────────────────────────────────────

  async function bekleyenIrsaliyeleriGoster() {
    const wrap = document.createElement('div');

    const baslik = document.createElement('div');
    baslik.style.cssText = 'font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px;';
    baslik.textContent = '📋 Bekleyen İrsaliyeler';
    wrap.appendChild(baslik);

    const tarihRow = document.createElement('div');
    tarihRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:10px;';

    const bugun = new Date().toISOString().split('T')[0];
    const buAyBas = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];

    const baslangicInp = document.createElement('input');
    baslangicInp.type = 'date';
    baslangicInp.className = 'fiyat-input';
    baslangicInp.style.flex = '1';
    baslangicInp.value = buAyBas;

    const araSpan = document.createElement('span');
    araSpan.style.cssText = 'font-size:12px;color:var(--muted);';
    araSpan.textContent = '—';

    const bitisInp = document.createElement('input');
    bitisInp.type = 'date';
    bitisInp.className = 'fiyat-input';
    bitisInp.style.flex = '1';
    bitisInp.value = bugun;

    tarihRow.appendChild(baslangicInp);
    tarihRow.appendChild(araSpan);
    tarihRow.appendChild(bitisInp);
    wrap.appendChild(tarihRow);

    const listeWrap = document.createElement('div');
    wrap.appendChild(listeWrap);

    const dahaFazlaWrap = document.createElement('div');
    wrap.appendChild(dahaFazlaWrap);

    addMessage('', 'bot', wrap);

    let mevcutSayfa = 1;
    async function irsaliyeleriYukle(sayfa, temizle) {
      if (temizle) listeWrap.innerHTML = '';
      dahaFazlaWrap.innerHTML = '';

      const yukleniyorEl = document.createElement('div');
      yukleniyorEl.style.cssText = 'font-size:12px;color:var(--muted);padding:8px 0;';
      yukleniyorEl.textContent = 'Yükleniyor…';
      listeWrap.appendChild(yukleniyorEl);

      try {
        const params = new URLSearchParams({
          baslangic: baslangicInp.value,
          bitis: bitisInp.value,
          sayfa: sayfa,
          sayfa_basi: 25
        });
        const res  = await fetch('/api/bekleyen-irsaliyeler?' + params.toString());
        const data = await res.json();
        listeWrap.removeChild(yukleniyorEl);

        if (!data.irsaliyeler || data.irsaliyeler.length === 0) {
          if (sayfa === 1) {
            const bosEl = document.createElement('div');
            bosEl.style.cssText = 'font-size:12px;color:var(--muted);padding:8px 0;';
            bosEl.textContent = '📋 Bu tarih aralığında bekleyen irsaliye yok.';
            listeWrap.appendChild(bosEl);
          }
          return;
        }

        if (sayfa === 1) {
          const sayacEl = document.createElement('div');
          sayacEl.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
          sayacEl.textContent = data.toplam + ' irsaliye — ' + (baslangicInp.value || '?') + ' / ' + (bitisInp.value || '?');
          listeWrap.insertBefore(sayacEl, listeWrap.firstChild);
        }

        data.irsaliyeler.forEach(function(irs) {
          const btn = document.createElement('button');
          btn.className = 'irsaliye-btn';
          const sol = document.createElement('span');
          sol.style.fontWeight = '500';
          sol.textContent = '🏭 ' + irs.cari_adi;
          const sag = document.createElement('span');
          sag.className = 'kg';
          sag.textContent = (irs.toplam_kg||0).toLocaleString('tr-TR') + ' kg';
          const ust = document.createElement('div');
          ust.style.cssText = 'display:flex;justify-content:space-between;width:100%;';
          ust.appendChild(sol);
          ust.appendChild(sag);
          btn.appendChild(ust);
          const alt = document.createElement('div');
          alt.style.cssText = 'font-size:11px;color:var(--muted);';
          const plaka = plakacikar(irs.aciklama);
          alt.textContent = formatTarih(irs.tarih) + (plaka ? '  ·  🚗 ' + plaka : '');
          btn.appendChild(alt);
          btn.onclick = function() { irsaliyeSecildi(irs, wrap); };
          listeWrap.appendChild(btn);
        });

        if (data.sonraki_sayfa_var) {
          const dahaBtn = document.createElement('button');
          dahaBtn.className = 'btn-cancel';
          dahaBtn.style.cssText = 'margin-top:6px;width:100%;';
          dahaBtn.textContent = '⬇ Daha Fazla Yükle';
          dahaBtn.onclick = async function() {
            mevcutSayfa++;
            dahaBtn.disabled = true;
            dahaBtn.textContent = 'Yükleniyor…';
            await irsaliyeleriYukle(mevcutSayfa, false);
          };
          dahaFazlaWrap.appendChild(dahaBtn);
        }
      } catch(e) {
        listeWrap.removeChild(yukleniyorEl);
        const hatEl = document.createElement('div');
        hatEl.style.cssText = 'font-size:12px;color:#f85149;';
        hatEl.textContent = '❌ İrsaliyeler yüklenemedi: ' + e.message;
        listeWrap.appendChild(hatEl);
      }
    }

    baslangicInp.onchange = function() { mevcutSayfa = 1; irsaliyeleriYukle(1, true); };
    bitisInp.onchange     = function() { mevcutSayfa = 1; irsaliyeleriYukle(1, true); };

    irsaliyeleriYukle(1, true);
  }

  // ── BAKİYELER ────────────────────────────────────────────────────

  async function bakiyeleriGoster(onMusteriFiltreParam) {
    showTyping();
    try {
      const carilerData = await carileriGetir(false);
      removeTyping();
      if (!carilerData || carilerData.length === 0) {
        addMessage('Kayıtlı cari bulunamadı.', 'bot');
        return;
      }
      let cariler = carilerData;
      if (onMusteriFiltreParam) {
        const filtre = onMusteriFiltreParam.toLowerCase();
        const eslesen = cariler.filter(function(c) { return c.ad.toLowerCase().includes(filtre); });
        if (eslesen.length > 0) cariler = eslesen;
      }
      const wrap = document.createElement('div');
      const baslik = document.createElement('div');
      baslik.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
      baslik.textContent = onMusteriFiltreParam
        ? onMusteriFiltreParam + " bakiyesi (Parasut):"
        : "Güncel bakiyeler (Parasut):";
      wrap.appendChild(baslik);
      cariler.forEach(function(c) {
        const row = document.createElement('div');
        row.className = 'cari-row';
        const ad = document.createElement('span');
        ad.className = 'cari-ad';
        ad.textContent = c.ad;
        const bak = document.createElement('span');
        const bakiye = c.bakiye || 0;
        if (bakiye > 0) {
          bak.className = 'cari-bakiye alacak';
          bak.textContent = bakiye.toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' TL ⚠️';
        } else if (bakiye < 0) {
          bak.className = 'cari-bakiye';
          bak.style.color = '#2563eb';
          bak.textContent = Math.abs(bakiye).toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' TL 🔵';
        } else {
          bak.className = 'cari-bakiye sifir';
          bak.textContent = '0 TL ✅';
        }
        row.appendChild(ad);
        row.appendChild(bak);
        wrap.appendChild(row);
      });
      const toplamAlacak = carilerData.reduce(function(s, c) { return s + (c.bakiye > 0 ? c.bakiye : 0); }, 0);
      const toplamOdeyecek = carilerData.reduce(function(s, c) { return s + (c.bakiye < 0 ? Math.abs(c.bakiye) : 0); }, 0);
      if (toplamAlacak > 0 || toplamOdeyecek > 0) {
        const toplamRow = document.createElement('div');
        toplamRow.style.cssText = 'margin-top:8px;padding:8px 14px;background:var(--accent-lt);border-radius:9px;font-size:12px;font-weight:600;color:var(--accent);';
        toplamRow.innerHTML =
          '<div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span>Toplam Alacak (⚠️)</span><span>' + toplamAlacak.toLocaleString('tr-TR', {minimumFractionDigits:2}) + ' TL</span></div>' +
          (toplamOdeyecek > 0 ? '<div style="display:flex;justify-content:space-between;color:#2563eb;"><span>Toplam Ödenecek (🔵)</span><span>' + toplamOdeyecek.toLocaleString('tr-TR', {minimumFractionDigits:2}) + ' TL</span></div>' : '');
        wrap.appendChild(toplamRow);
      }
      addMessage('💰 Müşteri Bakiyeleri:', 'bot', wrap);
    } catch {
      removeTyping();
      addMessage('❌ Bakiyeler yüklenemedi, tekrar deneyin.', 'bot');
    }
  }

    bitisInp.type = 'date';
    bitisInp.className = 'fiyat-input';
    bitisInp.style.flex = '1';
    bitisInp.value = new Date().toISOString().split('T')[0];

    tarihRow.appendChild(araLabel);
    tarihRow.appendChild(bitisInp);

    btnRow.className = 'btn-row';

    const sorguBtn = document.createElement('button');
    sorguBtn.className = 'btn-primary';
    sorguBtn.textContent = '📊 Özeti Getir';
    sorguBtn.onclick = async function() {
      sorguBtn.disabled = true;
      sorguBtn.textContent = 'Yükleniyor…';
      dropdown.style.display = 'none';
      try {
        const cari = secilenCari || cariInp.value.trim();
        const baslangic = baslangicInp.value;
        const bitis = bitisInp.value;

        if (cari) {
          const params = new URLSearchParams();
          if (baslangic) params.set('baslangic', baslangic);
          if (bitis)     params.set('bitis', bitis);
          params.set('sayfa', '1');
          params.set('limit', '25');

          const res  = await fetch('/api/islem-gecmisi/' + encodeURIComponent(cari) + '?' + params.toString());
          const data = await res.json();

          if (data.hata) { addMessage('❌ ' + data.hata, 'bot'); return; }

          const wrap = document.createElement('div');
          wrap.style.cssText = 'font-size:13px;';

          const baslikEl = document.createElement('div');
          baslikEl.style.cssText = 'font-weight:500;margin-bottom:10px;font-size:14px;';
          baslikEl.textContent = '📊 ' + (data.cari_adi || cari);
          wrap.appendChild(baslikEl);

          const bakiyeEl = document.createElement('div');
          bakiyeEl.style.cssText = 'margin-bottom:12px;padding:10px 14px;background:var(--accent-lt);border-radius:10px;border-left:3px solid var(--accent);';
          const bakiye = data.bakiye || 0;
          bakiyeEl.innerHTML = '<b>Güncel Bakiye:</b> <span style="color:' + (bakiye > 0 ? 'var(--alacak)' : 'var(--muted)') + ';font-weight:600;">' +
            bakiye.toLocaleString('tr-TR', {minimumFractionDigits:2}) + ' TL</span>' +
            (bakiye > 0 ? ' <span style="color:var(--muted);font-size:11px;">(bize borçlu)</span>' : '');
          if (baslangic || bitis) {
            bakiyeEl.innerHTML += '<br><span style="color:var(--muted);font-size:11px;">📅 ' + (baslangic || '—') + ' / ' + (bitis || '—') + '</span>';
          }
          wrap.appendChild(bakiyeEl);

          const islemListesi = document.createElement('div');
          const dahaFazlaWrap = document.createElement('div');
          wrap.appendChild(islemListesi);
          wrap.appendChild(dahaFazlaWrap);
          addMessage('', 'bot', wrap);

          let mevcutSayfa = 1;
          function islemleriRenderEt(data, temizle) {
            if (temizle) islemListesi.innerHTML = '';
            dahaFazlaWrap.innerHTML = '';

            const islemler = data.islemler || [];
            if (islemler.length === 0 && mevcutSayfa === 1) {
              const bos = document.createElement('div');
              bos.style.cssText = 'color:var(--muted);font-size:12px;';
              bos.textContent = 'Bu dönemde işlem bulunamadı.';
              islemListesi.appendChild(bos);
              return;
            }

            if (mevcutSayfa === 1) {
              const baslik2 = document.createElement('div');
              baslik2.style.cssText = 'font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;';
              baslik2.textContent = 'İşlem Geçmişi (' + (data.toplam_islem || islemler.length) + ' işlem)';
              islemListesi.appendChild(baslik2);
            }

            islemler.forEach(function(i) {
              const row = document.createElement('div');
              row.style.cssText = 'padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px;';
              const sol = document.createElement('div');
              const tur = i.tur || '-';
              const turEmoji = tur.includes('invoice') || tur.includes('fatura') ? '📄' : tur.includes('payment') || tur.includes('tahsilat') ? '💵' : '📋';
              sol.innerHTML = '<span style="color:var(--muted);margin-right:6px;">' + i.tarih + '</span>' + turEmoji + ' ' + (i.aciklama || tur);
              const sag = document.createElement('div');
              sag.style.cssText = 'font-weight:600;white-space:nowrap;margin-left:8px;';
              const tutar = i.tutar || 0;
              sag.style.color = tutar >= 0 ? 'var(--alacak)' : '#2a9d5c';
              sag.textContent = (tutar >= 0 ? '+' : '') + tutar.toLocaleString('tr-TR', {minimumFractionDigits:2}) + ' TL';
              row.appendChild(sol); row.appendChild(sag);
              islemListesi.appendChild(row);
            });

            if (data.sonraki_sayfa_var) {
              const dahaBtn = document.createElement('button');
              dahaBtn.className = 'btn-cancel';
              dahaBtn.style.cssText = 'margin-top:6px;width:100%;';
              dahaBtn.textContent = '⬇ Daha Fazla Yükle (' + ((mevcutSayfa * 25)) + '/' + (data.toplam_islem||'?') + ')';
              dahaBtn.onclick = async function() {
                mevcutSayfa++;
                dahaBtn.disabled = true; dahaBtn.textContent = 'Yükleniyor…';
                const p2 = new URLSearchParams();
                if (baslangic) p2.set('baslangic', baslangic);
                if (bitis)     p2.set('bitis', bitis);
                p2.set('sayfa', mevcutSayfa); p2.set('limit', '25');
                try {
                  const r2   = await fetch('/api/islem-gecmisi/' + encodeURIComponent(cari) + '?' + p2.toString());
                  const d2   = await r2.json();
                  islemleriRenderEt(d2, false);
                } catch(e) {
                  dahaBtn.textContent = '❌ Yüklenemedi'; dahaBtn.disabled = false;
                }
              };
              dahaFazlaWrap.appendChild(dahaBtn);
            }
          }

          islemleriRenderEt(data, true);
        } else {
          let url = '/api/hesap-ozeti';
          const params = [];
          if (baslangic) params.push('baslangic=' + baslangic);
          if (bitis) params.push('bitis=' + bitis);
          if (params.length) url += '?' + params.join('&');
          const res = await fetch(url);
          const data = await res.json();
          const satirlar = [];
          if (baslangic || bitis) {
            satirlar.push('📅 Dönem: ' + (baslangic || '—') + ' / ' + (bitis || '—'));
            satirlar.push('');
          }
          satirlar.push('👥 Toplam Cari: ' + (data.toplam_cari || 0));
          satirlar.push('🔴 Toplam Alacak: ' + (data.toplam_alacak || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' TL');
          satirlar.push('🟢 Toplam Borç: ' + (data.toplam_borclu || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' TL');
          addMessage(satirlar.join('\n'), 'bot');
        }
      } catch {
        addMessage('❌ Hesap özeti yüklenemedi, tekrar deneyin.', 'bot');
      } finally {
        sorguBtn.disabled = false;
        sorguBtn.textContent = '📊 Özeti Getir';
      }
    };

    const iptalBtn = document.createElement('button');
    iptalBtn.className = 'btn-cancel';
    iptalBtn.textContent = '✕ İptal';
    iptalBtn.onclick = function() { addMessage('❌ İptal edildi.', 'bot'); };

    btnRow.appendChild(sorguBtn);
    btnRow.appendChild(iptalBtn);
    wrap.appendChild(btnRow);

    addMessage('', 'bot', wrap);
    setTimeout(function() { cariInp.focus(); }, 100);
  }

  function tahsilatTutarGir(cariAdi, wrapParent, onTutar) {
    const tutarWrap = document.createElement('div');
    tutarWrap.style.cssText = 'margin-top:12px;border-top:1px solid var(--border);padding-top:12px;';

    const label = document.createElement('div');
    label.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:8px;';
    label.textContent = cariAdi + ' — Tahsilat tutarı:';
    tutarWrap.appendChild(label);

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'fiyat-input';
    inp.placeholder = 'Örn: 100000';
    if (onTutar) inp.value = String(onTutar);

    const tarihInp = document.createElement('input');
    tarihInp.type = 'date';
    tarihInp.className = 'fiyat-input';
    tarihInp.style.maxWidth = '150px';
    tarihInp.value = new Date().toISOString().split('T')[0];

    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = 'Kaydet';

    const iptalBtn = document.createElement('button');
    iptalBtn.className = 'btn-cancel';
    iptalBtn.textContent = '✕ İptal';
    iptalBtn.onclick = function() {
      inp.disabled = true;
      tarihInp.disabled = true;
      btn.disabled = true;
      iptalBtn.disabled = true;
      addMessage('❌ Tahsilat iptal edildi.', 'bot');
    };

    const tahsilatGonder = async function(onaylandi) {
      const tutar = parseFiyat(inp.value);
      if (!tutar || tutar <= 0) {
        inp.style.borderColor = '#e53e3e';
        inp.placeholder = 'Geçersiz! Örn: 4.566 veya 4566,50';
        return;
      }
      inp.style.borderColor = '';
      btn.disabled = true;
      iptalBtn.disabled = true;
      btn.textContent = 'Kaydediliyor…';
      try {
        const res = await fetch('/api/tahsilat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cari_adi: cariAdi,
            tutar: tutar,
            tarih: tarihInp.value.trim() || '',
            onaylandi: onaylandi || false
          })
        });
        const data = await res.json();

        if (!data.basarili && data.fazla_tutar) {
          btn.disabled = false;
          btn.textContent = 'Kaydet';
          tahsilatOnayDialogu(
            data.guncel_bakiye,
            data.girilen_tutar,
            cariAdi,
            function() { tahsilatGonder(true); }
          );
          return;
        }

        addMessage(cariAdi + ' — ' + tutar.toLocaleString('tr-TR') + ' TL tahsilat', 'user');
        addMessage(data.cevap, 'bot');
      } catch {
        btn.disabled = false;
        btn.textContent = 'Kaydet';
        addMessage('❌ Tahsilat eklenemedi, tekrar deneyin.', 'bot');
      }
    };
    const gonder = function() { tahsilatGonder(false); };

    btn.onclick = gonder;
    inp.onkeydown = function(e) { if (e.key === 'Enter') gonder(); };

    row.appendChild(inp);
    row.appendChild(tarihInp);
    row.appendChild(btn);
    row.appendChild(iptalBtn);
    tutarWrap.appendChild(row);

    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:10.5px;color:var(--muted2);margin-top:5px;';
    hint.textContent = 'Tarih seçilmezse bugün kullanılır.';
    tutarWrap.appendChild(hint);

    wrapParent.appendChild(tutarWrap);
    setTimeout(function() { inp.focus(); }, 100);
  }

  function tahsilatManuelGir(wrap) {

    const alanlar = [

      kaydetBtn.disabled = true;

      addMessage(cariAdi + ' — ' + tutar.toLocaleString('tr-TR') + ' TL tahsilat', 'user');

        });

      }
    };

    iptalBtn2.textContent = '✕ İptal';
    iptalBtn2.onclick = function() { addMessage('❌ Tahsilat iptal edildi.', 'bot'); };
    btnRow.appendChild(kaydetBtn);
    btnRow.appendChild(iptalBtn2);
    formWrap.appendChild(btnRow);
    wrap.appendChild(formWrap);
  }

  // ── CARİ SEÇİM DROPDOWN ──────────────────────────────────────────

  function cariSecimDropdown(cariler, onSec, placeholder) {
    placeholder = placeholder || 'Cari adı yazın...';
    const wrap = document.createElement('div');
    wrap.className = 'cari-search-wrap';

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'cari-search-input';
    inp.placeholder = placeholder;
    inp.autocomplete = 'off';

    const dropdown = document.createElement('div');
    dropdown.className = 'cari-dropdown';
    dropdown.style.display = 'none';

    function renderDropdown(filtre) {
      dropdown.innerHTML = '';
      if (!filtre || filtre.length === 0) {
        dropdown.style.display = 'none';
        return;
      }
      const liste = cariler.filter(function(c) {
        return c.ad.toLowerCase().includes(filtre.toLowerCase());
      });
      if (liste.length === 0) {
        const bos = document.createElement('div');
        bos.className = 'cari-dropdown-empty';
        bos.textContent = 'Cari bulunamadı';
        dropdown.appendChild(bos);
      } else {
        liste.forEach(function(c) {
          const item = document.createElement('div');
          item.className = 'cari-dropdown-item';
          const ad = document.createElement('span');
          ad.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
          ad.textContent = c.ad;
          item.appendChild(ad);
          const bakiye = c.bakiye || 0;
          if (bakiye !== 0) {
            const bak = document.createElement('span');
            bak.className = 'dd-bakiye';
            bak.style.cssText = 'flex-shrink:0;margin-left:8px;white-space:nowrap;';
            if (bakiye > 0) {
              bak.textContent = bakiye.toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL ⚠️';
            } else {
              bak.style.color = '#2563eb';
              bak.textContent = Math.abs(bakiye).toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL 🔵';
            }
            item.appendChild(bak);
          }
          item.onclick = function(e) {
            e.stopPropagation();
            inp.value = c.ad;
            dropdown.style.display = 'none';
            onSec(c);
          };
          dropdown.appendChild(item);
        });
      }
      dropdown.style.display = 'block';
    }

    inp.addEventListener('input', function() {
      renderDropdown(inp.value);
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') dropdown.style.display = 'none';
    });
    wrap.appendChild(inp);
    wrap.appendChild(dropdown);
    return { wrap, inp };
  }

  async function cariFaturalariniGetir(cariAdi, wrapParent) {
    const listWrap = document.createElement('div');

    const filterRow = document.createElement('div');
    filterRow.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;';

    const bugun   = new Date().toISOString().split('T')[0];

    const baslangicInp = document.createElement('input');

    const bitisInp = document.createElement('input');
    bitisInp.type = 'date';

    bitisInp.style.cssText = 'flex:1;min-width:120px;';
    bitisInp.value = bugun;
    bitisInp.title = 'Bitiş tarihi';

    const durumSel = document.createElement('select');

    [['', 'Tümü'], ['not_paid', '🟡 Ödenmemiş'], ['overdue', '🔴 Gecikmiş'], ['paid', '✅ Ödendi']].forEach(function([v, l]) {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = l;

    filterRow.appendChild(baslangicInp);
    filterRow.appendChild(araSpan);

    const faturaListesi = document.createElement('div');
    const dahaFazlaWrap = document.createElement('div');
    listWrap.appendChild(faturaListesi);
    listWrap.appendChild(dahaFazlaWrap);

    addMessage('', 'bot', listWrap);

    let mevcutSayfa = 1;
    async function faturalariYukle(sayfa, temizle) {
      if (temizle) faturaListesi.innerHTML = '';
      dahaFazlaWrap.innerHTML = '';

      const yukEl = document.createElement('div');
      yukEl.style.cssText = 'font-size:12px;color:var(--muted);padding:6px 0;';
      yukEl.textContent = 'Yükleniyor…';
      faturaListesi.appendChild(yukEl);

      try {
        const params = new URLSearchParams({ sayfa: sayfa, limit: 25 });
        if (baslangicInp.value) params.set('baslangic', baslangicInp.value);
        if (bitisInp.value)     params.set('bitis', bitisInp.value);
        if (durumSel.value)     params.set('durum', durumSel.value);

        const res  = await fetch('/api/cari-faturalar/' + encodeURIComponent(cariAdi) + '?' + params.toString());
        const data = await res.json();
        faturaListesi.removeChild(yukEl);

        if (!data.faturalar || data.faturalar.length === 0) {
          if (sayfa === 1) {
            const bosEl = document.createElement('div');
            bosEl.style.cssText = 'font-size:12px;color:var(--muted);padding:6px 0;';
            bosEl.textContent = 'Bu kriterlere uygun fatura bulunamadı.';
            faturaListesi.appendChild(bosEl);
          }
          return;
        }

        if (sayfa === 1) {
          baslikEl.textContent = cariAdi + ' — ' + (data.toplam_kayit || data.toplam) + ' fatura';
        }

        data.faturalar.forEach(function(f) {
          const btn = document.createElement('button');
          btn.className = 'irsaliye-btn';
          btn.style.cssText = btn.style.cssText + 'flex-direction:column;align-items:flex-start;gap:3px;';

          const ust = document.createElement('div');
          ust.style.cssText = 'display:flex;justify-content:space-between;width:100%;';
          const sol = document.createElement('span');
          sol.style.fontSize = '13px';
          const durumEmoji = f.durum === 'paid' ? '✅' : f.durum === 'overdue' ? '🔴' : '🟡';
          sol.textContent = durumEmoji + ' ' + formatTarih(f.tarih) + ' — ' + (f.aciklama || 'Fatura').substring(0, 40);
          const sag = document.createElement('span');
          sag.className = 'kg';
          sag.textContent = parseFloat(f.tutar || 0).toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL';
          ust.appendChild(sol); ust.appendChild(sag);
          btn.appendChild(ust);

          if (f.kalan > 0) {
            const alt = document.createElement('div');
            alt.style.cssText = 'font-size:11px;color:#b45309;';
            alt.textContent = 'Kalan: ' + parseFloat(f.kalan).toLocaleString('tr-TR', {minimumFractionDigits:0}) + ' TL';
            btn.appendChild(alt);
          }
          btn.onclick = function() {
            Array.from(faturaListesi.querySelectorAll('.irsaliye-btn')).forEach(function(b) { b.style.opacity='0.5'; b.disabled=true; });
            btn.style.opacity = '1'; btn.style.background = 'var(--accent-lt)'; btn.disabled = false;
            faturaDetayGoster(f.id, f.aciklama);
          };
          faturaListesi.appendChild(btn);
        });

        if (data.sonraki_sayfa_var) {
          const dahaBtn = document.createElement('button');
          dahaBtn.className = 'btn-cancel';
          dahaBtn.style.cssText = 'margin-top:6px;width:100%;';
          dahaBtn.textContent = '⬇ Daha Fazla Yükle (' + data.faturalar.length + '/' + (data.toplam_kayit||'?') + ')';
          dahaBtn.onclick = async function() {
            mevcutSayfa++;
            dahaBtn.disabled = true; dahaBtn.textContent = 'Yükleniyor…';
            await faturalariYukle(mevcutSayfa, false);
          };
          dahaFazlaWrap.appendChild(dahaBtn);
        }
      } catch(e) {
        faturaListesi.removeChild(yukEl);
        const hatEl = document.createElement('div');
        hatEl.style.cssText = 'font-size:12px;color:#f85149;';
        hatEl.textContent = '❌ Faturalar yüklenemedi: ' + e.message;
        faturaListesi.appendChild(hatEl);
      }
    }

    baslangicInp.onchange = function() { mevcutSayfa=1; faturalariYukle(1,true); };
    bitisInp.onchange     = function() { mevcutSayfa=1; faturalariYukle(1,true); };
    durumSel.onchange     = function() { mevcutSayfa=1; faturalariYukle(1,true); };

    faturalariYukle(1, true);
  }

  async function faturaDetayGoster(faturaId, faturaAdi) {
    showTyping();
    try {
      const res = await fetch('/api/fatura-detay/' + faturaId);
      const f = await res.json();
      removeTyping();

      const detayWrap = document.createElement('div');

      const ozet = document.createElement('div');
      ozet.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.8;';
      const durumEmoji = f.durum === 'paid' ? '✅ Ödendi' : f.durum === 'overdue' ? '🔴 Gecikmiş' : '🟡 Bekliyor';
      ozet.innerHTML = '📅 Tarih: ' + formatTarih(f.tarih) + ' &nbsp;|&nbsp; Vade: ' + formatTarih(f.vade) + '<br>' +

        tahBaslik.textContent = 'Tahsilatlar';
        detayWrap.appendChild(tahBaslik);

          const row = document.createElement('div');

          row.innerHTML = '<span>✅ ' + t.tarih + ' — ' + t.aciklama + '</span><span style="font-weight:600;color:var(--accent)">' + parseFloat(t.tutar||0).toLocaleString('tr-TR',{minimumFractionDigits:0}) + ' TL</span>';
          detayWrap.appendChild(row);

      if (f.irsaliye_ids && f.irsaliye_ids.length > 0) {

        irsBaslik.style.cssText = 'font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:0.4px;margin:10px 0 5px;';

        detayWrap.appendChild(irsBaslik);
        f.irsaliye_ids.forEach(function(id) {

          row.style.cssText = 'font-size:12px;padding:5px 10px;background:var(--bg);border-radius:7px;margin-bottom:4px;color:var(--muted);';

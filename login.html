<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profaix · Giriş</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ee;
      --surface: #fffefb;
      --border: #e8e0d5;
      --border2: #d8cfc3;
      --accent: #bf5b2a;
      --accent-lt: #fdf0e8;
      --accent-dim: rgba(191,91,42,0.12);
      --text: #1e1410;
      --text2: #5a4a3e;
      --muted: #998880;
      --muted2: #c8bdb5;
      --s1: 0 1px 3px rgba(80,40,15,0.08);
      --s2: 0 4px 20px rgba(80,40,15,0.12), 0 1px 4px rgba(80,40,15,0.06);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Arka plan desen — subtle */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(191,91,42,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(191,91,42,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .kart {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--s2);
      padding: 48px 44px;
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    /* Üst çizgi — accent rengi */
    .kart::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), rgba(191,91,42,0.3));
      border-radius: 0 0 3px 3px;
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 52px; height: 52px;
      background: var(--accent-lt);
      border: 1px solid rgba(191,91,42,0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .logo-icon svg {
      width: 22px; height: 22px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .logo h1 {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .logo h1 em { font-style: italic; color: var(--accent); }
    .logo p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      font-weight: 300;
    }

    .form-grup {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border2);
      border-radius: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    input::placeholder { color: var(--muted2); }

    .hatirla-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0;
    }
    .hatirla-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 4px;
    }
    .hatirla-row label {
      font-size: 13px;
      color: var(--text2);
      margin: 0;
      cursor: pointer;
      font-weight: 400;
      letter-spacing: 0;
    }

    .giris-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 11px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.2px;
    }
    .giris-btn:hover {
      background: #a84b22;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(191,91,42,0.35);
    }
    .giris-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .hata-mesaj {
      background: #fff5f5;
      border: 1px solid rgba(192,57,43,0.25);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 13px;
      color: #c0392b;
      margin-top: 14px;
      display: none;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11px;
      color: var(--muted2);
    }
  </style>
</head>
<body>
  <div class="kart">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M9 9h6M9 12h6M9 15h4"/>
        </svg>
      </div>
      <h1>Pro<em>faix</em></h1>
      <p>Muhasebe & Kantar Takip Sistemi</p>
    </div>

    <div class="form-grup">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" placeholder="kullanici_adi" autocomplete="username" autofocus>
    </div>

    <div class="form-grup">
      <label for="password">Şifre</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="hatirla-row">
      <input type="checkbox" id="beniHatirla">
      <label for="beniHatirla">Beni hatırla <span style="color:var(--muted2);font-size:11px;">(7 gün)</span></label>
    </div>

    <button class="giris-btn" id="girisBtn" onclick="girisYap()">Giriş Yap</button>
    <div class="hata-mesaj" id="hataMesaj"></div>

    <div class="footer">Profaix · Güvenli bağlantı</div>
  </div>

  <script>
    // Enter tuşuyla giriş
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') girisYap();
    });

    async function girisYap() {
      const username     = document.getElementById('username').value.trim();
      const password     = document.getElementById('password').value;
      const beniHatirla  = document.getElementById('beniHatirla').checked;
      const btn          = document.getElementById('girisBtn');
      const hata         = document.getElementById('hataMesaj');

      if (!username || !password) {
        hataGoster('Kullanıcı adı ve şifre gerekli.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor…';
      hata.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, beni_hatirla: beniHatirla })
        });
        const data = await res.json();

        if (data.basarili) {
          if (data.auth_token) {
            try { localStorage.setItem('profaix_auth_token', data.auth_token); } catch {}
          }
          btn.textContent = '✓ Yönlendiriliyor…';
          window.location.href = '/chat';
        } else {
          hataGoster(data.hata || 'Giriş başarısız.');
          btn.disabled = false;
          btn.textContent = 'Giriş Yap';
        }
      } catch {
        hataGoster('Bağlantı hatası, tekrar deneyin.');
        btn.disabled = false;
        btn.textContent = 'Giriş Yap';
      }
    }

    function hataGoster(mesaj) {
      const el = document.getElementById('hataMesaj');
      el.textContent = mesaj;
      el.style.display = 'block';
      // Shake animasyonu yeniden tetikle
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = 'shake 0.3s ease';
    }
  </script>
</body>
</html>
